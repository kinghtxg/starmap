# StarMap 星图 V1.0 默认配置
probe_enabled: false          # 主动探测开关（默认关闭）
capture_enabled: false        # 网卡实时抓包开关
capture_interfaces: []        # 抓包网卡列表，如 ["eth0","eth1"]
capture_bpf: ""               # BPF 过滤表达式
aging_seconds: 86400          # 边老化时长（秒）
aggregate_threshold: 20       # /24 网段聚合阈值
noise_bytes: 400              # 会话降噪字节阈值（§10.3）
noise_packets: 4              # 会话降噪包数阈值
noise_duration_sec: 2         # 会话降噪时长阈值（秒）
reverse_proxy_hosts: 10       # 反代判定 Host 域名数阈值
long_conn_seconds: 3600       # 长连接判定时长（秒）
heartbeat_max_bytes: 64       # 心跳包 payload 阈值（字节）
listen_addr: "127.0.0.1:8080"    # HTTP 监听地址（默认仅回环；对外请走反代 + 鉴权）
db_path: "starmap.db"         # SQLite 数据库路径
probe_token: ""               # 探针上报 token（可选，配置则校验，§10.7）
audit_retention_days: 90      # 审计日志保留天数（§10.8）
cors_origins: []              # CORS 白名单；为空则仅同源（不发 Allow-Origin 头）

# ---- 自动发现（V1.4）：周期扫描让拓扑自生长 ----
# 默认关闭。政务网/隔离环境默认不主动发包，需显式开启；开启前请确认已获授权。
auto_discovery_enabled: false
auto_discovery_sec: 1800      # 扫描间隔（秒），默认 30 分钟
auto_discovery_method: "arp"  # arp | icmp
auto_discovery_cidrs: []      # 目标网段，如 ["10.10.1.0/24","172.16.5.0/24"]
# V1.5 新网段自动识别：开启后自动跟随流量已发现的新网段（默认关闭，会扩大扫描范围）
auto_discovery_follow_discovered: false
auto_discovery_exclude_cidrs: ["169.254.0.0/16"]  # 排除网段（不扫）
auto_discovery_max_cidrs: 64                       # 单轮最多扫描网段数（防扫描面失控）
