<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网络域 · StarMap 星图</title>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<div class="sm-app">
  <aside class="sm-sider" id="smSider"></aside>

  <main class="sm-main">
    <header class="sm-topbar">
      <div class="sm-topbar-l">
        <h1 class="sm-h1">网络域管理</h1>
        <p class="sm-sub">定义 gov / office / internet / prod 等网络域，多域流量命中将触发「多网域融合」检测</p>
      </div>
      <div class="sm-toolbar">
        <button class="sm-btn" data-act="refresh" data-ico="refresh">刷新</button>
        <button class="sm-btn is-primary" data-act="create" data-ico="plus">新增网络域</button>
      </div>
    </header>

    <div class="sm-content">
      <div class="sm-anim" style="margin-bottom:12px" id="sumLine"></div>
      <div class="sm-grid sm-grid-auto sm-anim" style="--sm-d:60ms" id="list"></div>
    </div>
  </main>
</div>

<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script>
'use strict';

var all = [];

function load() {
  var box = document.getElementById('list');
  box.innerHTML = '<div class="sm-card"><div class="sm-card-bd">' + UI.skeletonRows(3) + '</div></div>';
  return API.domains().then(function (data) {
    all = Array.isArray(data) ? data : (data && data.Domains) || [];
    render();
  }).catch(function (e) {
    all = [];
    box.innerHTML = '<div class="sm-card"><div class="sm-card-bd">' + UI.errorHTML(e) + '</div></div>';
  });
}

function render() {
  var box = document.getElementById('list');
  var cidrs = 0;
  all.forEach(function (d) { cidrs += (d.CIDRs || []).length; });
  document.getElementById('sumLine').innerHTML =
    '<div class="sm-row is-center" style="gap:8px">' +
    '<span class="sm-badge is-brand">网络域 ' + all.length + '</span>' +
    '<span class="sm-badge">CIDR 条目 ' + cidrs + '</span>' +
    '<span class="sm-t-3" style="font-size:12px">节点归属网络域由 CIDR 匹配结果自动标注</span></div>';

  if (!all.length) {
    box.innerHTML = '<div class="sm-card" style="grid-column:1/-1"><div class="sm-card-bd">' +
      UI.emptyHTML('暂无网络域', '点击右上角「新增网络域」创建，用于多网域融合检测与拓扑着色',
        '<button class="sm-btn is-primary" data-act="create" data-ico="plus">新增网络域</button>') +
      '</div></div>';
    return;
  }

  box.innerHTML = all.map(function (d, i) {
    var color = d.Color || '#0052D9';
    return '<div class="sm-card" style="--sm-d:' + (i * 40) + 'ms;border-top:3px solid ' + UI.escAttr(color) + ';animation:sm-fade-up 240ms var(--sm-ease) both;animation-delay:' + (i * 40) + 'ms">' +
      '<div class="sm-card-hd">' +
      '<div class="sm-row is-center" style="gap:8px">' +
      '<span class="sm-dot" style="background:' + UI.escAttr(color) + '"></span>' +
      '<h2 style="color:' + UI.escAttr(color) + '">' + UI.esc(d.Name) + '</h2>' +
      '<span class="sm-badge">ID ' + UI.esc(d.ID) + '</span>' +
      '</div>' +
      '<div class="sm-toolbar">' +
      '<button class="sm-btn is-text is-sm" data-act="edit" data-id="' + UI.escAttr(d.ID) + '" data-ico="edit">编辑</button>' +
      '<button class="sm-btn is-text is-sm is-danger" data-act="del" data-id="' + UI.escAttr(d.ID) + '" data-ico="trash">删除</button>' +
      '</div></div>' +
      '<div class="sm-card-bd">' +
      '<div class="sm-label" style="margin-bottom:8px">CIDR 列表（' + ((d.CIDRs || []).length) + '）</div>' +
      ((d.CIDRs || []).length
        ? '<div class="sm-chips">' + d.CIDRs.map(function (c) {
          return '<span class="sm-chip">' + UI.esc(c) + '</span>';
        }).join('') + '</div>'
        : '<div class="sm-t-3" style="font-size:12px">未配置 CIDR</div>') +
      '</div></div>';
  }).join('');
}

/* ---------- 编辑弹窗 ---------- */
function openModal(d) {
  var color = (d && d.Color) || '#0052D9';
  UI.modal({
    title: d ? '编辑网络域' : '新增网络域',
    body:
      '<div class="sm-stack">' +
      '<div class="sm-field"><label>名称</label>' +
      '<input class="sm-input" id="dName" placeholder="如 gov / office / internet / prod" value="' + UI.escAttr(d ? d.Name : '') + '"></div>' +
      '<div class="sm-field"><label>CIDR 列表（每行一个）</label>' +
      '<textarea class="sm-textarea sm-mono" id="dCIDRs" rows="4" placeholder="10.0.0.0/8&#10;192.168.0.0/16">' +
      UI.esc(d ? (d.CIDRs || []).join('\n') : '') + '</textarea></div>' +
      '<div class="sm-field"><label>标识颜色</label>' +
      '<div class="sm-form-inline">' +
      '<input type="color" id="dColor" value="' + UI.escAttr(color) + '" style="width:44px;height:32px;flex:0 0 44px;padding:2px;border:1px solid var(--sm-border-strong);border-radius:3px;background:#fff;cursor:pointer">' +
      '<input class="sm-input sm-mono sm-w-auto" id="dColorVal" value="' + UI.escAttr(color) + '">' +
      '<span class="sm-hint">用于拓扑节点与网络域卡片着色</span>' +
      '</div></div></div>',
    okText: '保存',
    onOk: function (m) {
      var name = m.body.querySelector('#dName').value.trim();
      if (!name) { UI.toast('请填写名称', 'err'); return false; }
      var cidrs = m.body.querySelector('#dCIDRs').value.split('\n')
        .map(function (s) { return s.trim(); }).filter(Boolean);
      var payload = { Name: name, CIDRs: cidrs, Color: m.body.querySelector('#dColorVal').value.trim() || color };
      return (d ? API.updateDomain(d.ID, payload) : API.createDomain(payload))
        .then(function () { UI.toast('已保存', 'ok'); load(); });
    },
    onOpen: function (m) {
      var picker = m.body.querySelector('#dColor');
      var text = m.body.querySelector('#dColorVal');
      picker.addEventListener('input', function () { text.value = picker.value; });
      text.addEventListener('input', function () {
        if (/^#[0-9a-fA-F]{6}$/.test(text.value.trim())) picker.value = text.value.trim();
      });
    }
  });
}

function del(id) {
  var d = all.filter(function (x) { return String(x.ID) === String(id); })[0];
  UI.confirm({
    title: '删除网络域',
    content: '确认删除网络域 <b>' + UI.esc(d ? d.Name : id) + '</b> ？<br/>相关节点的网络域标注将同步失效。'
  }).then(function (ok) {
    if (!ok) return;
    API.deleteDomain(id)
      .then(function () { UI.toast('已删除', 'ok'); load(); })
      .catch(function (e) { UI.toast('删除失败：' + e.message, 'err'); });
  });
}

UI.on('refresh', load);
UI.on('create', function () { openModal(null); });
UI.on('edit', function (el) {
  var id = el.getAttribute('data-id');
  openModal(all.filter(function (x) { return String(x.ID) === String(id); })[0]);
});
UI.on('del', function (el) { del(el.getAttribute('data-id')); });

document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
