<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白名单 · StarMap 星图</title>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<div class="sm-app">
  <aside class="sm-sider" id="smSider"></aside>

  <main class="sm-main">
    <header class="sm-topbar">
      <div class="sm-topbar-l">
        <h1 class="sm-h1">白名单管理</h1>
        <p class="sm-sub">命中白名单的地址 / 主机 / 节点不再产生风险事件</p>
      </div>
      <div class="sm-toolbar">
        <div class="sm-search"><input class="sm-input is-sm" id="kw" placeholder="搜索值 / 备注" data-ico="search"></div>
        <button class="sm-btn" data-act="refresh" data-ico="refresh">刷新</button>
        <button class="sm-btn is-primary" data-act="create" data-ico="plus">新增条目</button>
      </div>
    </header>

    <div class="sm-content">
      <div class="sm-card sm-anim" style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden">
        <div class="sm-card-hd">
          <div class="sm-row is-center" style="gap:10px">
            <h2>白名单条目</h2>
            <span class="sm-badge" id="cntBadge">0 条</span>
          </div>
          <div class="sm-t-3">支持 CIDR 网段 / IP 地址 / 主机域名 / 拓扑节点 四个维度</div>
        </div>
        <div class="sm-card-bd is-flush" style="flex:1;overflow:auto">
          <div class="sm-table-wrap" id="list"></div>
        </div>
        <div id="pager"></div>
      </div>
    </div>
  </main>
</div>

<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script>
'use strict';

var KIND_LABEL = { cidr: 'CIDR 网段', ip: 'IP 地址', host: '主机/域名', node: '拓扑节点' };
var KIND_CLS = { cidr: 'is-brand', ip: 'is-info', host: 'is-success', node: 'is-warning' };
var all = [], view = [], page = 1;
var SIZE = 20;

function load() {
  var box = document.getElementById('list');
  box.innerHTML = UI.skeletonRows(5);
  return API.whitelist().then(function (data) {
    all = Array.isArray(data) ? data : (data && data.Entries) || [];
    applyFilter();
  }).catch(function (e) {
    all = []; view = [];
    box.innerHTML = UI.errorHTML(e);
    document.getElementById('pager').innerHTML = '';
  });
}

function applyFilter() {
  var kw = document.getElementById('kw').value.trim().toLowerCase();
  view = kw
    ? all.filter(function (w) {
      return String(w.Value).toLowerCase().indexOf(kw) >= 0 ||
        String(w.Note || '').toLowerCase().indexOf(kw) >= 0 ||
        String(w.Kind).toLowerCase().indexOf(kw) >= 0;
    })
    : all.slice();
  page = 1;
  render();
}

function render() {
  var box = document.getElementById('list');
  document.getElementById('cntBadge').textContent = view.length + ' 条';
  if (!view.length) {
    box.innerHTML = UI.emptyHTML('白名单为空', '点击右上角「新增条目」，命中后相关风险事件将被自动抑制',
      '<button class="sm-btn is-primary" data-act="create" data-ico="plus">新增条目</button>');
    document.getElementById('pager').innerHTML = '';
    return;
  }
  var start = (page - 1) * SIZE;
  var rows = view.slice(start, start + SIZE);
  box.innerHTML =
    '<table class="sm-table"><thead><tr>' +
    '<th style="min-width:100px">类型</th>' +
    '<th>值</th>' +
    '<th>备注</th>' +
    '<th style="min-width:150px">创建时间</th>' +
    '<th style="min-width:96px" class="sm-td-ops">操作</th>' +
    '</tr></thead><tbody>' +
    rows.map(function (w) {
      return '<tr>' +
        '<td><span class="sm-badge ' + (KIND_CLS[w.Kind] || '') + '">' + UI.esc(KIND_LABEL[w.Kind] || w.Kind) + '</span></td>' +
        '<td><span class="sm-mono" style="font-size:12px">' + UI.esc(w.Value) + '</span></td>' +
        '<td class="sm-t-2" style="font-size:12px">' + UI.esc(w.Note || '-') + '</td>' +
        '<td class="sm-t-3" style="font-size:12px">' + UI.esc(UI.fmtTime(w.CreatedAt)) + '</td>' +
        '<td class="sm-td-ops">' +
        '<button class="sm-btn is-text is-sm" data-act="edit" data-id="' + UI.escAttr(w.ID) + '">编辑</button>' +
        '<button class="sm-btn is-text is-sm is-danger" data-act="del" data-id="' + UI.escAttr(w.ID) + '">删除</button>' +
        '</td></tr>';
    }).join('') + '</tbody></table>';
  document.getElementById('pager').innerHTML = UI.pagerHTML(view.length, page, SIZE, 'page');
}

/* ---------- 编辑弹窗 ---------- */
function openModal(w) {
  UI.modal({
    title: w ? '编辑白名单' : '新增白名单',
    body:
      '<div class="sm-stack">' +
      '<div class="sm-field"><label>类型</label>' +
      '<select class="sm-select" id="wKind">' +
      ['cidr', 'ip', 'host', 'node'].map(function (k) {
        return '<option value="' + k + '"' + (w && w.Kind === k ? ' selected' : '') + '>' + KIND_LABEL[k] + '</option>';
      }).join('') +
      '</select></div>' +
      '<div class="sm-field"><label>值</label>' +
      '<input class="sm-input" id="wValue" placeholder="如 10.0.0.0/8、192.168.1.1、example.com" value="' + UI.escAttr(w ? w.Value : '') + '">' +
      '<div class="sm-hint">node 维度请填写拓扑节点 ID；cidr 需带掩码位数。</div></div>' +
      '<div class="sm-field"><label>备注</label>' +
      '<input class="sm-input" id="wNote" placeholder="可选，便于审计追溯" value="' + UI.escAttr(w ? (w.Note || '') : '') + '"></div>' +
      '</div>',
    okText: '保存',
    onOk: function (m) {
      var entry = {
        Kind: m.body.querySelector('#wKind').value,
        Value: m.body.querySelector('#wValue').value.trim(),
        Note: m.body.querySelector('#wNote').value.trim()
      };
      if (!entry.Value) { UI.toast('请填写值', 'err'); return false; }
      return (w ? API.updateWhitelist(w.ID, entry) : API.createWhitelist(entry))
        .then(function () { UI.toast('已保存', 'ok'); load(); });
    }
  });
}

function del(id) {
  var w = all.filter(function (x) { return String(x.ID) === String(id); })[0];
  UI.confirm({
    title: '删除白名单条目',
    content: '确认删除 <b>' + UI.esc(w ? w.Value : id) + '</b> ？<br/>删除后该维度重新纳入风险检测。'
  }).then(function (ok) {
    if (!ok) return;
    API.deleteWhitelist(id)
      .then(function () { UI.toast('已删除', 'ok'); load(); })
      .catch(function (e) { UI.toast('删除失败：' + e.message, 'err'); });
  });
}

/* ---------- 事件绑定 ---------- */
UI.on('refresh', load);
UI.on('create', function () { openModal(null); });
UI.on('edit', function (el) {
  var id = el.getAttribute('data-id');
  var w = all.filter(function (x) { return String(x.ID) === String(id); })[0];
  openModal(w);
});
UI.on('del', function (el) { del(el.getAttribute('data-id')); });
UI.on('page', function (el) { page = Number(el.getAttribute('data-page')) || 1; render(); });
document.getElementById('kw').addEventListener('input', applyFilter);

document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
