<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风险事件 · StarMap 星图</title>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<div class="sm-app">
  <aside class="sm-sider" id="smSider"></aside>

  <main class="sm-main">
    <header class="sm-topbar">
      <div class="sm-topbar-l">
        <h1 class="sm-h1">风险事件</h1>
        <p class="sm-sub">确认风险 → 归档 · 判定误报 → 自动加白 · 暂缓处置</p>
      </div>
      <div class="sm-toolbar">
        <div class="sm-search"><input class="sm-input is-sm" id="fKw" placeholder="搜索标题 / 节点" data-ico="search"></div>
        <select class="sm-select is-sm sm-w-auto" id="fStatus" aria-label="状态">
          <option value="">全部状态</option>
          <option value="pending" selected>待处置</option>
          <option value="confirmed">已确认</option>
          <option value="false_positive">误报</option>
          <option value="deferred">已暂缓</option>
        </select>
        <select class="sm-select is-sm sm-w-auto" id="fType" aria-label="类型">
          <option value="">全部类型</option>
          <option value="frp">FRP 隧道</option>
          <option value="clash">Clash/V2Ray</option>
          <option value="reverse_proxy">反向代理</option>
          <option value="unknown_egress">未知出口</option>
          <option value="multi_net">多网域融合</option>
        </select>
        <button class="sm-btn is-primary" data-act="query" data-ico="search">查询</button>
        <button class="sm-btn" data-act="refresh" data-ico="refresh">刷新</button>
      </div>
    </header>

    <div class="sm-content">
      <div class="sm-card sm-anim" style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden">
        <div class="sm-card-hd">
          <div class="sm-row is-center" style="gap:10px">
            <h2>事件列表</h2>
            <span class="sm-badge" id="cntBadge">0 条</span>
          </div>
          <div class="sm-t-3" id="sumLine">—</div>
        </div>
        <div class="sm-card-bd is-flush" style="flex:1;overflow:auto">
          <div class="sm-table-wrap" id="list"></div>
        </div>
        <div id="pager"></div>
      </div>
    </div>
  </main>
</div>

<!-- 详情抽屉：操作按钮统一置于底部 -->
<div class="sm-drawer-mask" id="drawer-mask" data-act="close-drawer"></div>
<aside class="sm-drawer" id="drawer">
  <div class="sm-drawer-hd">
    <h3 id="drawerTitle">事件详情</h3>
    <button class="sm-btn is-text is-icon is-sm" data-act="close-drawer" data-ico="close" title="关闭"></button>
  </div>
  <div class="sm-drawer-bd" id="drawerBody"></div>
  <div class="sm-drawer-ft" id="drawerFt"></div>
</aside>

<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script>
'use strict';

var TYPE_LABEL = { frp: 'FRP 隧道', clash: 'Clash/V2Ray', reverse_proxy: '反向代理', unknown_egress: '未知出口', multi_net: '多网域融合' };
var STATUS_LABEL = { pending: '待处置', confirmed: '已确认', false_positive: '误报', deferred: '已暂缓' };
var STATUS_CLS = { pending: 'is-warning', confirmed: 'is-danger', false_positive: 'is-success', deferred: '' };

var all = [];      // 全量事件
var view = [];     // 过滤后
var page = 1;
var SIZE = 20;
var current = null;

function typeLabel(t) { return TYPE_LABEL[t] || t || '-'; }
function statusBadge(s) {
  return '<span class="sm-badge ' + (STATUS_CLS[s] || '') + '">' + UI.esc(STATUS_LABEL[s] || s || '-') + '</span>';
}

/* ---------- 加载 ---------- */
function load() {
  var box = document.getElementById('list');
  box.innerHTML = UI.skeletonRows(6);
  var status = document.getElementById('fStatus').value;
  var type = document.getElementById('fType').value;
  return API.events({ status: status, type: type })
    .then(function (data) {
      all = Array.isArray(data) ? data : (data && data.Events) || [];
      applyFilter();
    })
    .catch(function (e) {
      all = [];
      view = [];
      box.innerHTML = UI.errorHTML(e);
      document.getElementById('pager').innerHTML = '';
      document.getElementById('sumLine').textContent = '—';
    });
}

function applyFilter() {
  var kw = document.getElementById('fKw').value.trim().toLowerCase();
  view = kw
    ? all.filter(function (e) {
      return String(e.Title || '').toLowerCase().indexOf(kw) >= 0 ||
        String(e.NodeID).indexOf(kw) >= 0 ||
        String(e.NodeAPID || '').toLowerCase().indexOf(kw) >= 0 ||
        String(e.Detail || '').toLowerCase().indexOf(kw) >= 0;
    })
    : all.slice();
  page = 1;
  render();
}

function render() {
  var box = document.getElementById('list');
  var st = { high: 0, mid: 0, pending: 0 };
  all.forEach(function (e) {
    if (e.Level === 'high') st.high++;
    if (e.Level === 'mid') st.mid++;
    if (e.Status === 'pending') st.pending++;
  });
  document.getElementById('sumLine').textContent =
    '高危 ' + st.high + ' · 中危 ' + st.mid + ' · 待处置 ' + st.pending;
  document.getElementById('cntBadge').textContent = view.length + ' 条';

  if (!view.length) {
    box.innerHTML = UI.emptyHTML('暂无符合条件的风险事件', '可调整筛选条件，或等待检测引擎产出新的告警');
    document.getElementById('pager').innerHTML = '';
    return;
  }

  var total = view.length;
  var start = (page - 1) * SIZE;
  var rows = view.slice(start, start + SIZE);

  box.innerHTML =
    '<table class="sm-table"><thead><tr>' +
    '<th style="min-width:76px">风险</th>' +
    '<th>标题</th>' +
    '<th style="min-width:96px">类型</th>' +
    '<th style="min-width:130px">关联节点</th>' +
    '<th style="min-width:80px">状态</th>' +
    '<th style="min-width:150px">发现时间</th>' +
    '<th style="min-width:76px" class="sm-td-ops">操作</th>' +
    '</tr></thead><tbody>' +
    rows.map(function (ev) {
      return '<tr>' +
        '<td>' + UI.riskTag(ev.Level) + '</td>' +
        '<td><div class="sm-ellipsis" title="' + UI.escAttr(ev.Title) + '">' + UI.esc(ev.Title) + '</div></td>' +
        '<td class="sm-t-2" style="font-size:12px">' + UI.esc(typeLabel(ev.Type)) + '</td>' +
        '<td><span class="sm-mono" style="font-size:12px">' + UI.esc(ev.NodeAPID || ev.NodeID) + '</span></td>' +
        '<td>' + statusBadge(ev.Status) + '</td>' +
        '<td class="sm-t-3" style="font-size:12px">' + UI.esc(UI.fmtTime(ev.CreatedAt)) + '</td>' +
        '<td class="sm-td-ops"><button class="sm-btn is-text is-sm" data-act="open" data-id="' + UI.escAttr(ev.ID) + '">复核</button></td>' +
        '</tr>';
    }).join('') +
    '</tbody></table>';
  document.getElementById('pager').innerHTML = UI.pagerHTML(total, page, SIZE, 'page');
}

/* ---------- 抽屉 ---------- */
function openDrawer(id) {
  var ev = all.filter(function (x) { return String(x.ID) === String(id); })[0];
  if (!ev) return;
  current = ev;
  document.getElementById('drawerTitle').textContent = ev.Title || '事件详情';

  var evidence = ev.Evidence && Object.keys(ev.Evidence).length
    ? '<pre class="sm-code" style="max-height:220px">' + UI.esc(JSON.stringify(ev.Evidence, null, 2)) + '</pre>'
    : '<div class="sm-t-3" style="font-size:12px">暂无证据数据</div>';

  document.getElementById('drawerBody').innerHTML =
    '<div class="sm-stack-sm">' +
    kv('类型', '<span class="sm-badge is-brand">' + UI.esc(typeLabel(ev.Type)) + '</span>') +
    kv('风险等级', UI.riskTag(ev.Level)) +
    kv('处置状态', statusBadge(ev.Status)) +
    kv('关联节点', '<span class="sm-mono">' + UI.esc(ev.NodeAPID || ev.NodeID) + '</span>') +
    kv('详情', UI.esc(ev.Detail || '-')) +
    kv('创建时间', UI.fmtTime(ev.CreatedAt)) +
    kv('更新时间', UI.fmtTime(ev.UpdatedAt)) +
    '</div>' +
    '<div class="sm-divider"></div>' +
    '<div class="sm-label" style="margin-bottom:8px">证据</div>' + evidence +
    '<div class="sm-divider"></div>' +
    '<div class="sm-label" style="margin-bottom:10px">操作留痕</div>' + timeline(ev);

  document.getElementById('drawerFt').innerHTML =
    '<input class="sm-input is-sm sm-w-auto" id="rvReviewer" placeholder="操作人" style="min-width:100px">' +
    '<input class="sm-input is-sm" id="rvNote" placeholder="处置备注（必填）" style="flex:1">' +
    '<button class="sm-btn is-danger" data-act="review" data-v="confirm">确认归档</button>' +
    '<button class="sm-btn is-warn" data-act="review" data-v="false_positive">误报加白</button>' +
    '<button class="sm-btn" data-act="review" data-v="defer">暂缓</button>';

  UI.openDrawer('drawer');
}
function kv(k, v) {
  return '<div class="sm-kv"><div class="sm-kv-k">' + k + '</div><div class="sm-kv-v">' + v + '</div></div>';
}
function timeline(ev) {
  var items = [{ t: ev.CreatedAt, c: '事件创建（检测引擎）' }];
  if (ev.UpdatedAt && ev.UpdatedAt !== ev.CreatedAt) {
    items.push({
      t: ev.UpdatedAt,
      c: '复核操作：' + (STATUS_LABEL[ev.Status] || ev.Status) +
        (ev.Reviewer ? ' · 操作人 ' + ev.Reviewer : '') +
        (ev.ReviewNote ? ' · 备注：' + ev.ReviewNote : '')
    });
  }
  return '<div class="sm-timeline">' + items.map(function (i) {
    return '<div class="sm-timeline-item"><div class="sm-timeline-t">' + UI.esc(UI.fmtTime(i.t)) + '</div>' +
      '<div class="sm-timeline-c">' + UI.esc(i.c) + '</div></div>';
  }).join('') + '</div>';
}

function review(action) {
  if (!current) return;
  var note = (document.getElementById('rvNote').value || '').trim();
  var reviewer = (document.getElementById('rvReviewer').value || '').trim();
  if (!note) { UI.toast('请填写处置备注', 'err'); return; }
  API.reviewEvent(current.ID, action, note, reviewer)
    .then(function () {
      UI.toast({ confirm: '已确认风险并归档', false_positive: '已判定误报并自动加白', defer: '已暂缓处置' }[action] || '操作成功', 'ok');
      UI.closeDrawer('drawer');
      load();
    })
    .catch(function (e) { UI.toast('操作失败：' + e.message, 'err'); });
}

/* ---------- 事件绑定 ---------- */
UI.on('query', applyFilter);
UI.on('refresh', load);
UI.on('open', function (el) { openDrawer(el.getAttribute('data-id')); });
UI.on('close-drawer', function () { UI.closeDrawer('drawer'); });
UI.on('review', function (el) { review(el.getAttribute('data-v')); });
UI.on('page', function (el) {
  page = Number(el.getAttribute('data-page')) || 1;
  render();
});
document.getElementById('fKw').addEventListener('input', applyFilter);
document.getElementById('drawer-mask').addEventListener('click', function () { UI.closeDrawer('drawer'); });

document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
