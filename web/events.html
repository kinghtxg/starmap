<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风险事件 · StarMap 星图</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: {
  base: '#0F172A', card: '#1E293B', accent: '#38BDF8', body: '#E2E8F0',
  riskHigh: '#F87171', riskMid: '#FB923C', riskLow: '#4ADE80'
} } } };
</script>
</head>
<body class="bg-base text-body min-h-screen">
<div class="ml-56 p-6">
  <header class="mb-5">
    <h1 class="text-xl font-bold">风险事件工作台</h1>
    <p class="text-xs text-slate-400 mt-1">确认风险 → 归档 · 判定误报 → 自动加白 · 暂缓处置</p>
  </header>

  <div class="flex flex-wrap gap-3 mb-4 items-center">
    <select id="fStatus" class="bg-card border border-slate-600 rounded px-3 py-1.5 text-sm">
      <option value="">全部状态</option>
      <option value="pending" selected>待处置</option>
      <option value="confirmed">已确认</option>
      <option value="false_positive">误报</option>
      <option value="deferred">已暂缓</option>
    </select>
    <select id="fType" class="bg-card border border-slate-600 rounded px-3 py-1.5 text-sm">
      <option value="">全部类型</option>
      <option value="frp">FRP 隧道</option>
      <option value="clash">Clash/V2Ray</option>
      <option value="reverse_proxy">反向代理</option>
      <option value="unknown_egress">未知出口</option>
      <option value="multi_net">多网域融合</option>
    </select>
    <button onclick="load()" class="px-3 py-1.5 text-xs rounded bg-accent/20 text-accent border border-accent/40 hover:bg-accent/30">查询</button>
  </div>

  <div id="list" class="space-y-3"></div>
</div>

<!-- 详情抽屉 -->
<div id="drawerMask" class="fixed inset-0 bg-black/50 z-40 hidden" onclick="closeDrawer()"></div>
<div id="drawer" class="fixed top-0 right-0 bottom-0 w-[30rem] max-w-full bg-card border-l border-slate-700 z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
  <div class="flex items-center justify-between px-5 py-4 border-b border-slate-700">
    <h2 class="font-bold text-accent">事件详情</h2>
    <button onclick="closeDrawer()" class="text-slate-400 hover:text-body text-xl leading-none">&times;</button>
  </div>
  <div id="drawerBody" class="flex-1 overflow-y-auto p-5 space-y-5 text-sm"></div>
</div>

<script src="assets/layout.js"></script>
<script src="assets/api.js"></script>
<script>
const TYPE_LABEL = { frp: 'FRP 隧道', clash: 'Clash/V2Ray', reverse_proxy: '反向代理', unknown_egress: '未知出口', multi_net: '多网域融合' };
const STATUS_LABEL = { pending: '待处置', confirmed: '已确认', false_positive: '误报', deferred: '已暂缓' };
const STATUS_COLOR = { pending: '#FB923C', confirmed: '#F87171', false_positive: '#4ADE80', deferred: '#94A3B8' };
let current = null;

function typeLabel(t) { return TYPE_LABEL[t] || t || '-'; }

async function load() {
  const el = document.getElementById('list');
  el.innerHTML = UI.loadingHTML('正在加载事件…');
  try {
    const data = await API.events({ status: document.getElementById('fStatus').value, type: document.getElementById('fType').value });
    const events = Array.isArray(data) ? data : (data && data.Events) || [];
    if (!events.length) { el.innerHTML = UI.emptyHTML('暂无符合条件的风险事件', '可调整筛选条件或等待检测引擎产出'); return; }
    el.innerHTML = events.map(ev => {
      const c = UI.riskColor(ev.Level);
      return '<div class="bg-card rounded-xl border border-slate-700/60 p-4 flex items-center gap-4 cursor-pointer hover:border-accent/50 transition-colors" onclick="openDrawer(\'' + UI.esc(ev.ID) + '\')">' +
        '<span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:' + c + '"></span>' +
        '<div class="flex-1 min-w-0">' +
        '  <div class="font-medium truncate">' + UI.esc(ev.Title) + '</div>' +
        '  <div class="text-xs text-slate-400 mt-1">' + typeLabel(ev.Type) + ' · 节点 ' + UI.esc(ev.NodeID) + ' · ' + UI.fmtTime(ev.CreatedAt) + '</div>' +
        '</div>' +
        '<span class="text-xs px-2 py-1 rounded border shrink-0" style="color:' + STATUS_COLOR[ev.Status] + ';border-color:' + STATUS_COLOR[ev.Status] + '55">' + (STATUS_LABEL[ev.Status] || ev.Status) + '</span>' +
        '</div>';
    }).join('');
    window._events = events;
  } catch (e) {
    el.innerHTML = UI.errorHTML(e);
  }
}

function openDrawer(id) {
  const ev = (window._events || []).find(x => String(x.ID) === String(id));
  if (!ev) return;
  current = ev;
  const body = document.getElementById('drawerBody');
  const evidence = ev.Evidence && Object.keys(ev.Evidence).length
    ? '<pre class="bg-base/70 rounded-lg p-3 text-xs overflow-x-auto text-slate-300">' + UI.esc(JSON.stringify(ev.Evidence, null, 2)) + '</pre>'
    : '<div class="text-xs text-slate-500">暂无证据数据</div>';
  body.innerHTML =
    '<div class="space-y-3">' +
    field('标题', UI.esc(ev.Title)) +
    field('类型', typeLabel(ev.Type)) +
    field('级别', UI.riskBadge(ev.Level)) +
    field('状态', '<span style="color:' + STATUS_COLOR[ev.Status] + '">' + (STATUS_LABEL[ev.Status] || ev.Status) + '</span>') +
    field('关联节点', UI.esc(ev.NodeID)) +
    field('详情', UI.esc(ev.Detail || '-')) +
    field('创建时间', UI.fmtTime(ev.CreatedAt)) +
    field('更新时间', UI.fmtTime(ev.UpdatedAt)) +
    '</div>' +
    '<div><div class="text-xs text-slate-400 mb-1.5">证据</div>' + evidence + '</div>' +
    '<div><div class="text-xs text-slate-400 mb-1.5">操作留痕</div>' + timelineHTML(ev) + '</div>' +
    '<div class="bg-base/50 rounded-lg p-4 space-y-3">' +
    '  <div class="text-xs text-slate-400">处置操作（误报将自动加白）</div>' +
    '  <input id="rvReviewer" placeholder="操作人（Reviewer）" class="w-full bg-card border border-slate-600 rounded px-3 py-1.5 text-sm" value="">' +
    '  <textarea id="rvNote" rows="2" placeholder="处置备注（必填）" class="w-full bg-card border border-slate-600 rounded px-3 py-1.5 text-sm"></textarea>' +
    '  <div class="flex gap-2">' +
    '    <button onclick="review(\'confirm\')" class="flex-1 py-1.5 text-xs rounded bg-riskHigh/20 text-riskHigh border border-riskHigh/40 hover:bg-riskHigh/30">确认风险·归档</button>' +
    '    <button onclick="review(\'false_positive\')" class="flex-1 py-1.5 text-xs rounded bg-riskLow/20 text-riskLow border border-riskLow/40 hover:bg-riskLow/30">判定误报·加白</button>' +
    '    <button onclick="review(\'defer\')" class="flex-1 py-1.5 text-xs rounded bg-slate-500/20 text-slate-300 border border-slate-500/40 hover:bg-slate-500/30">暂缓</button>' +
    '  </div>' +
    '</div>';
  document.getElementById('drawerMask').classList.remove('hidden');
  const d = document.getElementById('drawer');
  d.classList.remove('translate-x-full');
}
function field(k, v) {
  return '<div><div class="text-xs text-slate-400 mb-0.5">' + k + '</div><div class="break-all">' + v + '</div></div>';
}
function timelineHTML(ev) {
  const items = [];
  items.push({ t: ev.CreatedAt, text: '事件创建（检测引擎）' });
  if (ev.UpdatedAt && ev.UpdatedAt !== ev.CreatedAt) {
    items.push({ t: ev.UpdatedAt, text: '复核操作：' + (STATUS_LABEL[ev.Status] || ev.Status) +
      (ev.Reviewer ? ' · 操作人 ' + ev.Reviewer : '') + (ev.ReviewNote ? ' · 备注：' + ev.ReviewNote : '') });
  }
  return '<div class="border-l-2 border-slate-600 ml-1.5 pl-4 space-y-3">' +
    items.map(i => '<div class="relative"><span class="absolute -left-[1.42rem] top-1 w-2.5 h-2.5 rounded-full bg-accent"></span>' +
      '<div class="text-xs text-slate-400">' + UI.fmtTime(i.t) + '</div>' +
      '<div class="text-xs mt-0.5">' + UI.esc(i.text) + '</div></div>').join('') + '</div>';
}
function closeDrawer() {
  document.getElementById('drawerMask').classList.add('hidden');
  document.getElementById('drawer').classList.add('translate-x-full');
  current = null;
}
async function review(action) {
  if (!current) return;
  const note = document.getElementById('rvNote').value.trim();
  const reviewer = document.getElementById('rvReviewer').value.trim();
  if (!note) { UI.toast('请填写处置备注', 'err'); return; }
  try {
    await API.reviewEvent(current.ID, action, note, reviewer);
    UI.toast({ confirm: '已确认风险并归档', false_positive: '已判定误报并自动加白', defer: '已暂缓处置' }[action] || '操作成功', 'ok');
    closeDrawer();
    load();
  } catch (e) { UI.toast('操作失败：' + e.message, 'err'); }
}

document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
