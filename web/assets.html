<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主机资产 · StarMap 星图</title>
<link rel="stylesheet" href="assets/theme.css">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
<div class="sm-app">
  <header class="sm-topbar" id="smTopbar"></header>

  <div class="sm-body">
    <aside class="sm-sider" id="smSider"></aside>

    <main class="sm-main">
      <div class="sm-pagehd">
        <div class="sm-pagehd-main">
          <span class="sm-pill">测绘</span>
          <h1 class="sm-h1">主机资产</h1>
          <p class="sm-sub">网络资产管理 · 台账对照（账实差异）· 账外资产发现 · 端口记录（流量 + 主动扫描双来源）</p>
        </div>
          <div class="sm-toolbar">
          <button class="sm-btn" data-act="refresh" data-ico="refresh">刷新</button>
        </div>
      </div>

    <div class="sm-content">
      <div class="sm-grid sm-grid-4 sm-anim" id="statsBar"></div>

      <div class="sm-tabbar sm-anim" style="margin-top:14px">
        <button class="sm-tab is-active" data-tab="assets">主机资产</button>
        <button class="sm-tab" data-tab="ports">端口记录</button>
        <button class="sm-tab" data-tab="ledger">台账对照</button>
      </div>

      <!-- 主机资产 -->
      <section id="tab-assets" class="sm-card sm-anim" style="margin-top:12px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden">
        <div class="sm-card-hd">
          <div class="sm-row is-center" style="gap:10px">
            <h2>资产清单</h2>
            <span class="sm-badge" id="cntBadge">0 台</span>
          </div>
          <div class="sm-toolbar">
            <div class="sm-search"><input class="sm-input is-sm" id="fKw" placeholder="搜索 IP / MAC / 归属" data-ico="search"></div>
            <select class="sm-select is-sm sm-w-auto" id="fStatus" aria-label="状态筛选">
              <option value="">全部</option>
              <option value="unarchived">未归档</option>
              <option value="archived">已纳管</option>
            </select>
          </div>
        </div>
        <div class="sm-card-bd is-flush" style="flex:1;overflow:auto">
          <div class="sm-table-wrap">
            <table class="sm-table" id="assetTable"></table>
          </div>
        </div>
        <div class="sm-card-ft" id="assetPager"></div>
      </section>

      <!-- 端口记录 -->
      <section id="tab-ports" class="sm-card sm-anim sm-hide" style="margin-top:12px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden">
        <div class="sm-card-hd">
          <div class="sm-row is-center" style="gap:10px">
            <h2>端口记录</h2>
            <span class="sm-badge" id="portCnt">0 条</span>
          </div>
          <div class="sm-toolbar">
            <div class="sm-search"><input class="sm-input is-sm" id="pIp" placeholder="按 IP 过滤" data-ico="search"></div>
            <button class="sm-btn is-primary" data-role="operator" data-act="discover" data-ico="drill">深度发现</button>
            <button class="sm-btn" data-role="operator" data-act="scan" data-ico="target">nmap 扫描</button>
          </div>
        </div>
        <div class="sm-card-bd is-flush" style="flex:1;overflow:auto">
          <div class="sm-table-wrap">
            <table class="sm-table" id="portTable"></table>
          </div>
        </div>
        <div class="sm-card-ft" id="portPager"></div>
      </section>

      <!-- 台账对照（V1.7） -->
      <section id="tab-ledger" class="sm-card sm-anim sm-hide" style="margin-top:12px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden">
        <div class="sm-card-hd">
          <div class="sm-row is-center" style="gap:10px;min-width:0">
            <h2 style="white-space:nowrap">台账对照</h2>
            <span class="sm-badge" id="ledgerBatch">未导入</span>
          </div>
          <div class="sm-toolbar">
            <div class="sm-search" style="flex:0 1 168px;min-width:120px"><input class="sm-input is-sm" id="lKw" placeholder="搜索 IP / MAC" data-ico="search"></div>
            <button class="sm-btn is-sm" data-act="ledger-refresh" data-ico="refresh">重新对照</button>
            <button class="sm-btn is-sm is-primary" data-act="ledger-import" data-ico="upload">导入台账</button>
            <button class="sm-btn is-sm is-icon is-text is-danger" data-act="ledger-clear" data-ico="trash" title="清空台账"></button>
          </div>
        </div>
        <div class="sm-card-bd is-flush" style="flex:1;overflow:auto">
          <div id="ledgerSummary" style="padding:12px 16px 0"></div>
          <div class="sm-tabbar" id="ledgerFilters" style="margin:10px 16px 0;background:transparent"></div>
          <div class="sm-table-wrap" style="margin-top:10px">
            <table class="sm-table" id="ledgerTable"></table>
          </div>
        </div>
      </section>
    </div>
  </main>
  </div>
</div>

<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script>
'use strict';

var assets = [];
var ports = [];
var curTab = 'assets';

/* ---------- Tab 切换 ---------- */
function switchTab(t) {
  curTab = t;
  document.querySelectorAll('.sm-tab[data-tab]').forEach(function (b) { b.classList.toggle('is-active', b.getAttribute('data-tab') === t); });
  document.getElementById('tab-assets').classList.toggle('sm-hide', t !== 'assets');
  document.getElementById('tab-ports').classList.toggle('sm-hide', t !== 'ports');
  document.getElementById('tab-ledger').classList.toggle('sm-hide', t !== 'ledger');
  if (t === 'ledger') loadLedger();
}

/* ---------- 统计 ---------- */
function renderStats() {
  return API.assetStats().then(function (st) {
    st = st || {};
    var items = [
      { k: '资产总数', v: st.total || 0, i: 'asset', ex: '已纳管 ' + (st.archived || 0) + ' 台' },
      { k: '未归档资产', v: st.unarchived || 0, i: 'warn', cls: st.unarchived ? 'is-warn' : 'is-ok', ex: '系统发现、未登记归属' },
      { k: '在线主机', v: st.online || 0, i: 'node', cls: 'is-ok', ex: '最近活跃' },
      { k: '离线主机', v: st.offline || 0, i: 'clock', cls: 'is-off', ex: '超时未发现' }
    ];
    var host = document.getElementById('statsBar');
    host.innerHTML = items.map(function (it) {
      return '<div class="sm-stat ' + (it.cls || '') + '">' +
        '<div class="sm-stat-ico">' + UI.ico(it.i) + '</div>' +
        '<div style="min-width:0">' +
        '<div class="sm-stat-val" data-v="' + it.v + '">0</div>' +
        '<div class="sm-stat-key">' + it.k + '</div>' +
        (it.ex ? '<div class="sm-stat-extra">' + UI.esc(it.ex) + '</div>' : '') +
        '</div></div>';
    }).join('');
    host.querySelectorAll('.sm-stat-val').forEach(function (el) { UI.countTo(el, Number(el.getAttribute('data-v')) || 0); });
  }).catch(function () {});
}

/* ---------- 主机资产 ---------- */
function statusBadge(a) {
  if (a.status === 'archived') return '<span class="sm-badge is-brand">已纳管</span>';
  return '<span class="sm-badge is-warning">未归档</span>';
}
function onlineDot(on) {
  return on
    ? '<span class="sm-dot is-on"></span> 在线'
    : '<span class="sm-dot is-off"></span> 离线';
}

function renderAssets() {
  var kw = (document.getElementById('fKw').value || '').toLowerCase();
  var st = document.getElementById('fStatus').value;
  var list = assets.filter(function (a) {
    if (st && a.status !== st) return false;
    if (kw) {
      var hay = (a.ips || []).join(' ') + ' ' + (a.mac || '') + ' ' + (a.owner || '') + ' ' + (a.department || '') + ' ' + (a.hostname || '');
      if (hay.toLowerCase().indexOf(kw) < 0) return false;
    }
    return true;
  });
  document.getElementById('cntBadge').textContent = list.length + ' 台';
  var box = document.getElementById('assetTable');
  if (!list.length) {
    box.innerHTML = '<tbody><tr class="sm-empty-row"><td colspan="9">' + UI.emptyHTML('暂无资产', '导入 PCAP 或启动抓包后，系统自动发现主机并登记为账外资产') + '</td></tr></tbody>';
    document.getElementById('assetPager').innerHTML = '';
    return;
  }
  var html = '<thead><tr>' +
    '<th>IP 地址</th><th>MAC</th><th>主机名 / 系统</th><th>归属单位</th><th>归属人</th>' +
    '<th style="min-width:80px">状态</th><th style="min-width:90px">在线</th><th style="min-width:150px">最后发现</th>' +
    '<th style="min-width:140px" class="sm-td-ops">操作</th></tr></thead><tbody>';
  html += list.map(function (a) {
    var ips = (a.ips && a.ips.length) ? a.ips.map(function (i) { return '<div class="sm-mono" style="font-size:12px">' + UI.esc(i) + '</div>'; }).join('') : '-';
    var os = a.os ? '<span class="sm-chip">' + UI.esc(a.os) + '</span>' : '';
    var hn = a.hostname ? '<div style="font-size:12px">' + UI.esc(a.hostname) + '</div>' : '';
    var ops = a.status === 'archived'
      ? '<button class="sm-btn is-text is-sm" data-act="edit" data-key="' + UI.escAttr(a.node_key) + '">编辑</button>' +
        '<button class="sm-btn is-text is-sm is-danger" data-role="admin" data-act="del" data-key="' + UI.escAttr(a.node_key) + '">删除</button>'
      : '<button class="sm-btn is-text is-sm is-primary" data-act="archive" data-key="' + UI.escAttr(a.node_key) + '" data-ip="' + UI.escAttr((a.ips && a.ips[0]) || '') + '">归档登记</button>' +
        '<button class="sm-btn is-text is-sm is-danger" data-role="admin" data-act="del" data-key="' + UI.escAttr(a.node_key) + '">删除</button>';
    return '<tr>' +
      '<td>' + ips + '</td>' +
      '<td><span class="sm-mono" style="font-size:12px">' + UI.esc(a.mac || '-') + '</span></td>' +
      '<td>' + hn + os + '</td>' +
      '<td>' + UI.esc(a.department || '-') + '</td>' +
      '<td>' + UI.esc(a.owner || '-') + '</td>' +
      '<td>' + statusBadge(a) + '</td>' +
      '<td>' + onlineDot(a.online) + '</td>' +
      '<td class="sm-t-3" style="font-size:12px">' + UI.esc(UI.fmtAgo(a.last_seen)) + '</td>' +
      '<td class="sm-td-ops">' + ops + '</td></tr>';
  }).join('');
  html += '</tbody>';
  box.innerHTML = html;
}

/* ---------- 归档 / 编辑弹窗 ---------- */
function assetForm(a) {
  var isEdit = a && a.status === 'archived';
  return UI.modal({
    title: isEdit ? '编辑资产信息' : '归档登记 · 纳入资产台账',
    width: 520,
    body:
      '<div class="sm-stack">' +
      '<div class="sm-alert is-info"><span class="sm-alert-ico">' + UI.ico('info') + '</span>' +
      '<div class="sm-alert-body">' + (isEdit ? '维护资产台账信息' : '将账外资产登记入台账，补充归属信息。') + '<br>' +
      '<span class="sm-mono" style="font-size:12px">' + UI.esc((a.ips || []).join(', ') || a.node_key) + '</span></div></div>' +
      '<div class="sm-row is-center" style="gap:10px">' +
      '<div class="sm-field sm-flex-1"><label>归属单位</label><input class="sm-input" id="fDept" value="' + UI.escAttr(a.department || '') + '"></div>' +
      '<div class="sm-field sm-flex-1"><label>归属人</label><input class="sm-input" id="fOwner" value="' + UI.escAttr(a.owner || '') + '"></div></div>' +
      '<div class="sm-row is-center" style="gap:10px">' +
      '<div class="sm-field sm-flex-1"><label>主机名</label><input class="sm-input" id="fHost" value="' + UI.escAttr(a.hostname || '') + '"></div>' +
      '<div class="sm-field sm-flex-1"><label>主机系统</label><input class="sm-input" id="fOS" placeholder="如 Windows Server 2022" value="' + UI.escAttr(a.os || '') + '"></div></div>' +
      '<div class="sm-field"><label>物理位置</label><input class="sm-input" id="fLoc" placeholder="如 3F 机房 A 机柜" value="' + UI.escAttr(a.location || '') + '"></div>' +
      '<div class="sm-field"><label>备注</label><textarea class="sm-textarea" id="fDesc" rows="2">' + UI.esc(a.description || '') + '</textarea></div>' +
      '</div>',
    okText: isEdit ? '保存' : '归档',
    onOk: function (m) {
      var payload = {
        department: m.body.querySelector('#fDept').value.trim(),
        owner: m.body.querySelector('#fOwner').value.trim(),
        hostname: m.body.querySelector('#fHost').value.trim(),
        os: m.body.querySelector('#fOS').value.trim(),
        location: m.body.querySelector('#fLoc').value.trim(),
        description: m.body.querySelector('#fDesc').value.trim()
      };
      var p = isEdit ? API.updateAsset(a.node_key, payload) : API.archiveAsset(Object.assign({ node_key: a.node_key }, payload));
      return p.then(function () { UI.toast(isEdit ? '已保存' : '已归档登记', 'ok'); loadAll(); });
    }
  });
}

/* ---------- 端口记录 ---------- */
var SRC_LABEL = { traffic: '流量', probe: '扫描', arp: 'ARP' };
function renderPorts() {
  var kw = (document.getElementById('pIp').value || '').toLowerCase();
  var list = ports.filter(function (p) { return !kw || (p.ip || '').indexOf(kw) >= 0; });
  document.getElementById('portCnt').textContent = list.length + ' 条';
  var box = document.getElementById('portTable');
  if (!list.length) {
    box.innerHTML = '<tbody><tr class="sm-empty-row"><td colspan="7">' + UI.emptyHTML('暂无端口记录', '从流量自动提取，或点击「深度发现」做内置扫描（无需 nmap）') + '</td></tr></tbody>';
    document.getElementById('portPager').innerHTML = '';
    return;
  }
  var html = '<thead><tr>' +
    '<th>IP 地址</th><th style="min-width:80px">端口</th><th style="min-width:80px">协议</th>' +
    '<th>服务</th><th style="min-width:180px">指纹</th>' +
    '<th style="min-width:90px">来源</th><th style="min-width:150px">最后发现</th></tr></thead><tbody>';
  html += list.map(function (p) {
    return '<tr>' +
      '<td><span class="sm-mono" style="font-size:12px">' + UI.esc(p.ip) + '</span></td>' +
      '<td><span class="sm-mono" style="font-weight:600">' + p.port + '</span></td>' +
      '<td>' + UI.esc(p.proto.toUpperCase()) + '</td>' +
      '<td>' + (p.service ? '<span class="sm-chip">' + UI.esc(p.service) + '</span>' : '-') + '</td>' +
      '<td>' + fpHTML(p) + '</td>' +
      '<td><span class="sm-badge">' + UI.esc(SRC_LABEL[p.source] || p.source) + '</span></td>' +
      '<td class="sm-t-3" style="font-size:12px">' + UI.esc(UI.fmtAgo(p.last_seen)) + '</td></tr>';
  }).join('');
  html += '</tbody>';
  box.innerHTML = html;
}

// 指纹列：优先产品名（最有判断价值），其次标题 / banner / 证书 CN。
// 详情走 title 属性，不额外占列宽——端口表本来就宽。
function fpHTML(p) {
  var label = '';
  if (p.product) label = p.product + (p.version ? ' ' + p.version : '');
  else if (p.title) label = p.title;
  else if (p.tls_cn) label = '证书 ' + p.tls_cn;
  else if (p.banner) label = p.banner;
  if (!label) return '<span class="sm-t-3">-</span>';
  var tips = [];
  if (p.title && p.title !== label) tips.push('标题：' + p.title);
  if (p.tls_cn) tips.push('证书 CN：' + p.tls_cn);
  if (p.tls_names && p.tls_names.length) tips.push('证书 SAN：' + p.tls_names.join(', '));
  if (p.banner && p.banner !== label) tips.push('Banner：' + p.banner);
  if (p.favicon_hash) tips.push('favicon：' + p.favicon_hash);
  var text = label.length > 34 ? label.slice(0, 34) + '…' : label;
  return '<span class="sm-chip" title="' + UI.escAttr(tips.join('\n') || label) + '">' + UI.esc(text) + '</span>';
}

/* ---------- 主动扫描 ---------- */
function scanModal() {
  UI.modal({
    title: '主动端口扫描（nmap）',
    width: 480,
    body:
      '<div class="sm-stack">' +
      '<div class="sm-alert is-info"><span class="sm-alert-ico">' + UI.ico('info') + '</span>' +
      '<div class="sm-alert-body">调用系统 nmap 扫描目标开放端口（默认全端口 1-65535，可在系统配置调整）。全端口扫描耗时较长，后台异步执行。</div></div>' +
      '<div class="sm-field"><label>扫描目标（IP 或网段）</label>' +
      '<input class="sm-input" id="sTarget" placeholder="如 192.168.1.0/24"></div>' +
      '<div id="sStatus" style="font-size:12px"></div>' +
      '</div>',
    okText: '开始扫描',
    hideCancel: true,
    onOk: function (m) {
      var target = m.body.querySelector('#sTarget').value.trim();
      if (!target) { UI.toast('请填写扫描目标', 'err'); return false; }
      return API.scanPorts(target).then(function (r) {
        UI.toast('扫描任务已启动', 'ok');
        pollScan(r.task_id, m.body.querySelector('#sStatus'), m);
        return false; // 不关闭弹窗，轮询展示进度
      });
    }
  });
}
function pollScan(id, host, m) {
  host.innerHTML = UI.loadingHTML('正在扫描（全端口，可能需要数分钟）…');
  var timer = setInterval(function () {
    API.scanPortsStatus(id).then(function (t) {
      if (t.status === 'running') {
        host.innerHTML = UI.loadingHTML('扫描中… 目标 ' + UI.esc(t.target));
      } else if (t.status === 'done') {
        clearInterval(timer);
        host.innerHTML = '<div class="sm-alert is-ok"><span class="sm-alert-ico">' + UI.ico('check') + '</span><div class="sm-alert-body">扫描完成，发现 ' + t.found + ' 个开放端口</div></div>';
        UI.toast('扫描完成，发现 ' + t.found + ' 个端口', 'ok');
        setTimeout(function () { m.close(); }, 1200);
        loadAll();
      } else {
        clearInterval(timer);
        host.innerHTML = '<div class="sm-alert is-danger"><span class="sm-alert-ico">' + UI.ico('warn') + '</span><div class="sm-alert-body">' + UI.esc(t.error || '扫描失败') + '</div></div>';
      }
    }).catch(function (e) { clearInterval(timer); host.innerHTML = UI.errorHTML(e); });
  }, 3000);
}

/* ---------- 深度发现（1.2：内置端口扫描 + 服务指纹，不依赖 nmap） ---------- */
var DISC_PROFILES = [
  { k: 'quick', label: '快速 · 内网高价值端口（约 100 个，秒级）' },
  { k: 'standard', label: '标准 · 1-1024 + 常见高位端口（约 1.1 千个）' },
  { k: 'full', label: '全端口 · 1-65535（慢，需谨慎）' }
];

function discoverModal() {
  var opts = DISC_PROFILES.map(function (p) {
    return '<option value="' + p.k + '">' + UI.esc(p.label) + '</option>';
  }).join('');
  // 任务只能同时跑一个：轮询期间重复点「开始发现」会再起一轮扫描，
  // 结果是同一个网段被两倍速率打两遍。结束后按钮改成「关闭」，语义才对得上。
  var state = { running: false, done: false };
  UI.modal({
    title: '深度发现（内置扫描 + 服务指纹）',
    width: 560,
    body:
      '<div class="sm-stack">' +
      '<div class="sm-alert is-info"><span class="sm-alert-ico">' + UI.ico('info') + '</span>' +
      '<div class="sm-alert-body">不依赖 nmap，纯内置 TCP 扫描：先扫端口，再对高价值端口认服务（产品 / 版本 / 页面标题 / TLS 证书 / favicon）。扫描按配置的速率上限发包，避免打挂老交换机。</div></div>' +
      '<div class="sm-field"><label>扫描目标（IP / 网段，多个用逗号分隔）</label>' +
      '<input class="sm-input" id="dTarget" placeholder="如 192.168.31.0/24,10.1.2.3"></div>' +
      '<div class="sm-field"><label>端口档位</label>' +
      '<select class="sm-select" id="dProfile">' + opts + '</select></div>' +
      '<label class="sm-check"><input type="checkbox" id="dFingerprint" checked>识别服务指纹（推荐开启）</label>' +
      '<div id="dStatus" style="font-size:12px"></div>' +
      '</div>',
    okText: '开始发现',
    hideCancel: true,
    onOk: function (m) {
      if (state.done) { return true; }            // 已经出结果，按钮变「关闭」
      if (state.running) {                        // 扫描中，别开第二轮
        UI.toast('正在扫描，请等待本轮结束', 'warn');
        return false;
      }
      var body = m.body;
      var target = body.querySelector('#dTarget').value.trim();
      if (!target) { UI.toast('请填写扫描目标', 'err'); return false; }
      var payload = {
        target: target,
        profile: body.querySelector('#dProfile').value,
        fingerprint: body.querySelector('#dFingerprint').checked
      };
      return API.discoverRun(payload).then(function (r) {
        UI.toast('发现任务已启动（' + r.hosts + ' 个地址）', 'ok');
        state.running = true;
        lockInputs(body, true);
        pollDiscover(r.task_id, body.querySelector('#dStatus'), m, function (ok) {
          state.running = false;
          if (!ok) { lockInputs(body, false); return; } // 失败可改目标重试，别把弹窗锁死
          state.done = true;
          var btn = m.el.querySelector('[data-act="sm-modal-ok"] .sm-btn-ico');
          if (btn) { btn.textContent = '关闭'; }
        });
        return false; // 保持弹窗，展示进度
      });
    }
  });
}

// 扫描期间锁住输入：改了目标但按钮还是「开始发现」会让人以为能改档重扫，
// 实际只会另起一轮任务。
function lockInputs(body, b) {
  ['#dTarget', '#dProfile', '#dFingerprint'].forEach(function (sel) {
    var el = body.querySelector(sel);
    if (el) { el.disabled = !!b; }
  });
}

function pollDiscover(id, host, m, onFinish) {
  host.innerHTML = UI.loadingHTML('正在扫描…');
  var finished = false;
  function stop(ok) {
    if (finished) { return; }
    finished = true;
    if (onFinish) { onFinish(ok); }
  }
  var timer = setInterval(function () {
    API.discoverStatus(id).then(function (t) {
      if (finished) { clearInterval(timer); return; }
      var pct = t.total ? Math.round((t.done / t.total) * 100) : 0;
      if (t.status === 'running') {
        host.innerHTML = UI.loadingHTML(
          '扫描中 ' + t.done + '/' + t.total + '（' + pct + '%）· 存活 ' + t.alive +
          ' · 开放端口 ' + t.open_ports + ' · 指纹 ' + t.fingerprints +
          (t.current ? ' · 当前 ' + UI.esc(t.current) : ''));
        return;
      }
      clearInterval(timer);
      stop(t.status !== 'error');
      if (t.status === 'error') {
        host.innerHTML = '<div class="sm-alert is-danger"><span class="sm-alert-ico">' + UI.ico('warn') + '</span>' +
          '<div class="sm-alert-body">' + UI.esc(t.error || '发现失败') + '</div></div>';
        return;
      }
      host.innerHTML = discoverResultHTML(t);
      UI.toast('发现完成：存活 ' + t.alive + ' 台 · 端口 ' + t.open_ports + ' 个 · 指纹 ' + t.fingerprints + ' 条', 'ok');
      loadAll();
    }).catch(function (e) {
      clearInterval(timer);
      stop(false);
      host.innerHTML = UI.errorHTML(e);
    });
  }, 2000);
}

function discoverResultHTML(t) {
  var head = '<div class="sm-alert is-ok"><span class="sm-alert-ico">' + UI.ico('check') + '</span>' +
    '<div class="sm-alert-body">扫描完成：' + t.total + ' 个地址 · 存活 ' + t.alive +
    ' 台 · 开放端口 ' + t.open_ports + ' 个 · 指纹 ' + t.fingerprints + ' 条</div></div>';
  var hosts = t.hosts || [];
  if (!hosts.length) {
    return head + '<div class="sm-t-3" style="font-size:12px;margin-top:8px">没有发现开放的端口。若目标是内网设备，可换用「全端口」档位再试一次。</div>';
  }
  var rows = hosts.map(function (h) {
    var svc = (h.services || []).length
      ? h.services.map(function (x) { return '<span class="sm-chip" style="margin:1px 2px">' + UI.esc(x) + '</span>'; }).join('')
      : '<span class="sm-t-3">-</span>';
    var name = h.product || h.title || (h.tls_cn ? '证书 ' + h.tls_cn : '');
    return '<tr><td><span class="sm-mono" style="font-size:12px">' + UI.esc(h.ip) + '</span></td>' +
      '<td><span class="sm-mono">' + (h.ports || []).length + '</span></td>' +
      '<td>' + svc + '</td>' +
      '<td class="sm-t-3" style="font-size:12px">' + (name ? UI.esc(name) : '-') + '</td></tr>';
  }).join('');
  return head +
    '<div class="sm-table-wrap" style="margin-top:10px;max-height:280px;overflow:auto">' +
    '<table class="sm-table"><thead><tr><th>IP</th><th>开放端口</th><th>识别到的服务</th><th>产品 / 标题</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>' +
    (t.truncated ? '<div class="sm-t-3" style="font-size:12px;margin-top:6px">仅展示前 ' + hosts.length + ' 台活跃主机，完整结果已写入端口记录。</div>' : '');
}

/* ---------- 台账对照（V1.7） ---------- */
var ledger = { summary: {}, managed: [], unmanaged: [], ghost: [], ip_mismatch: [] };
var ledgerKind = 'all';

var LEDGER_KINDS = [
  { k: 'all', label: '全部' },
  { k: 'unmanaged', label: '台账外设备' },
  { k: 'managed', label: '在册在网' },
  { k: 'ip_mismatch', label: 'IP 不符' },
  { k: 'ghost', label: '僵尸记录' }
];
var LEDGER_BADGE = {
  managed: '<span class="sm-badge is-ok">在册在网</span>',
  unmanaged: '<span class="sm-badge is-danger">台账外</span>',
  ghost: '<span class="sm-badge is-warning">僵尸记录</span>',
  ip_mismatch: '<span class="sm-badge is-brand">IP 不符</span>'
};
var RISK_BADGE = {
  high: '<span class="sm-badge is-danger">高</span>',
  mid: '<span class="sm-badge is-warning">中</span>',
  low: '<span class="sm-badge">低</span>'
};

function loadLedger() {
  return API.ledgerDiff().then(function (d) {
    ledger = d || { summary: {}, managed: [], unmanaged: [], ghost: [], ip_mismatch: [] };
    renderLedger();
  }).catch(function (e) {
    UI.toast('台账对照失败：' + e.message, 'err');
  });
}

function renderLedger() {
  var s = ledger.summary || {};
  var cards = [
    { k: '台账条目', v: s.ledger_total || 0, i: 'asset', cls: '', ex: '人工登记' },
    { k: '台账外设备', v: s.unmanaged || 0, i: 'warn', cls: (s.unmanaged ? 'is-high' : 'is-ok'), ex: '网内有、台账无' },
    { k: '在册在网', v: s.managed || 0, i: 'check', cls: 'is-ok', ex: '账实一致' },
    { k: '台账僵尸', v: s.ghost || 0, i: 'clock', cls: (s.ghost ? 'is-warn' : ''), ex: '台账有、网内无' }
  ];
  var sum = document.getElementById('ledgerSummary');
  sum.innerHTML = '<div class="sm-grid sm-grid-4" style="gap:10px">' + cards.map(function (it) {
    return '<div class="sm-stat ' + (it.cls || '') + '" style="padding:12px 14px">' +
      '<div class="sm-stat-ico">' + UI.ico(it.i) + '</div>' +
      '<div style="min-width:0">' +
      '<div class="sm-stat-val" data-v="' + it.v + '">0</div>' +
      '<div class="sm-stat-key">' + it.k + '</div>' +
      '<div class="sm-stat-extra">' + UI.esc(it.ex) + '</div>' +
      '</div></div>';
  }).join('') + '</div>';
  sum.querySelectorAll('.sm-stat-val').forEach(function (el) { UI.countTo(el, Number(el.getAttribute('data-v')) || 0); });

  document.getElementById('ledgerBatch').textContent = (s.ledger_total || 0) + ' 条台账';

  var counts = {
    all: (s.managed || 0) + (s.unmanaged || 0) + (s.ghost || 0) + (s.ip_mismatch || 0),
    managed: s.managed || 0, unmanaged: s.unmanaged || 0,
    ghost: s.ghost || 0, ip_mismatch: s.ip_mismatch || 0
  };
  document.getElementById('ledgerFilters').innerHTML = LEDGER_KINDS.map(function (x) {
    return '<button class="sm-tab' + (ledgerKind === x.k ? ' is-active' : '') + '" data-kind="' + x.k + '">' +
      UI.esc(x.label) + ' <span class="sm-t-3">' + (counts[x.k] || 0) + '</span></button>';
  }).join('');
  document.querySelectorAll('#ledgerFilters .sm-tab').forEach(function (b) {
    b.addEventListener('click', function () { ledgerKind = b.getAttribute('data-kind'); renderLedger(); });
  });

  renderLedgerTable();
}

function ledgerRows() {
  var out = [];
  ['unmanaged', 'managed', 'ip_mismatch', 'ghost'].forEach(function (k) {
    (ledger[k] || []).forEach(function (x) { out.push(x); });
  });
  if (ledgerKind !== 'all') out = out.filter(function (x) { return x.kind === ledgerKind; });
  var kw = (document.getElementById('lKw').value || '').toLowerCase();
  if (kw) {
    out = out.filter(function (x) {
      var hay = [x.ip, x.ledger_ip, x.mac, x.hostname, x.department, x.owner, x.location].join(' ').toLowerCase();
      return hay.indexOf(kw) >= 0;
    });
  }
  return out;
}

function renderLedgerTable() {
  var box = document.getElementById('ledgerTable');
  var list = ledgerRows();
  if (!list.length) {
    var hasLedger = (ledger.summary && ledger.summary.ledger_total) > 0;
    var hasHost = (ledger.summary && ledger.summary.host_total) > 0;
    var title = hasLedger ? '该类差异为空' : '尚未导入资产台账';
    var desc = hasLedger
      ? '切换到其它分类查看，或重新导入一份最新台账。'
      : (hasHost
        ? '当前网内已发现 ' + ledger.summary.host_total + ' 台主机，全部无法与台账核对。导入台账 CSV 后即可得到「账外设备 / 在册在网 / 僵尸记录」三类差异。'
        : '先导入流量发现主机，再导入台账 CSV 做账实对照。');
    box.innerHTML = '<tbody><tr class="sm-empty-row"><td colspan="8">' +
      UI.emptyHTML(title, desc) +
      '<div style="margin-top:12px"><button class="sm-btn is-primary" data-act="ledger-import" data-ico="upload">导入台账 CSV</button></div>' +
      '</td></tr></tbody>';
    return;
  }
  var html = '<thead><tr>' +
    '<th style="min-width:130px">IP 地址</th><th style="min-width:140px">MAC</th>' +
    '<th style="min-width:150px">主机名 / 系统</th><th style="min-width:140px">归属 / 位置</th>' +
    '<th style="min-width:90px">差异</th><th style="min-width:70px">在线</th>' +
    '<th style="min-width:60px">风险</th><th style="min-width:100px">最后发现</th>' +
    '</tr></thead><tbody>';
  html += list.map(function (x) {
    var ipCell = '<span class="sm-mono" style="font-size:12px">' + UI.esc(x.ip || '-') + '</span>';
    if (x.kind === 'ip_mismatch' && x.ledger_ip) {
      ipCell += '<div class="sm-t-3" style="font-size:11px">台账登记 ' + UI.esc(x.ledger_ip) + '</div>';
    }
    var hn = x.hostname ? '<div style="font-size:12px">' + UI.esc(x.hostname) + '</div>' : '';
    var os = x.os ? '<span class="sm-chip">' + UI.esc(x.os) + '</span>' : '';
    var owner = [x.department, x.owner].filter(Boolean).join(' / ');
    var online = x.kind === 'ghost'
      ? '<span class="sm-dot is-off"></span> 未发现'
      : (x.online ? '<span class="sm-dot is-on"></span> 在线' : '<span class="sm-dot is-off"></span> 离线');
    return '<tr>' +
      '<td>' + ipCell + '</td>' +
      '<td><span class="sm-mono" style="font-size:12px">' + UI.esc(x.mac || '-') + '</span></td>' +
      '<td>' + (hn + os || '-') + '</td>' +
      '<td>' + (owner ? UI.esc(owner) : '-') +
      (x.location ? '<div class="sm-t-3" style="font-size:11px">' + UI.esc(x.location) + '</div>' : '') + '</td>' +
      '<td>' + (LEDGER_BADGE[x.kind] || '') + '</td>' +
      '<td>' + online + '</td>' +
      '<td>' + (RISK_BADGE[x.risk_level] || '<span class="sm-t-3">—</span>') + '</td>' +
      '<td class="sm-t-3" style="font-size:12px">' + (x.last_seen ? UI.esc(UI.fmtAgo(x.last_seen)) : '—') + '</td>' +
      '</tr>';
  }).join('');
  box.innerHTML = html + '</tbody>';
}

/* ---------- 台账导入 ---------- */
var LEDGER_TEMPLATE = 'IP地址,MAC地址,主机名,操作系统,归属单位,归属人,物理位置,备注\n' +
  '10.0.0.11,aa:bb:cc:00:00:11,oa-pc-01,Windows 10,办公室,张三,3F-301,正常办公\n';

function downloadLedgerTemplate() {
  var blob = new Blob(['\ufeff' + LEDGER_TEMPLATE], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'starmap-台账模板.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
}

function ledgerImportModal() {
  UI.modal({
    title: '导入资产台账',
    width: 620,
    body:
      '<div class="sm-stack">' +
      '<div class="sm-alert is-info"><span class="sm-alert-ico">' + UI.ico('info') + '</span>' +
      '<div class="sm-alert-body">台账是<strong>人工登记的“应该有什么”</strong>，导入后与拓扑观测结果对照。' +
      '<br>每次导入<strong>全量替换</strong>上一份台账；CSV 需含 IP 列（ip / IP地址 / 地址），其余列可选。</div></div>' +
      '<div class="sm-dropzone" id="lDrop" style="padding:20px">' +
      '<div class="sm-dropzone-ico">' + UI.ico('upload') + '</div>' +
      '<div style="font-weight:600">点击选择 CSV 文件，或拖拽到此处</div>' +
      '<div class="sm-t-3" style="font-size:12px;margin-top:4px">支持 UTF-8 / 带 BOM 的 Excel 导出文件；单份上限 16MB</div>' +
      '<input type="file" id="lFile" accept=".csv,text/csv" style="display:none">' +
      '</div>' +
      '<div class="sm-field"><label>或直接粘贴台账内容（含表头）</label>' +
      '<textarea class="sm-textarea" id="lText" rows="6" placeholder="IP地址,MAC地址,主机名,归属单位,归属人&#10;10.0.0.11,aa:bb:cc:00:00:11,oa-pc-01,办公室,张三" style="font-family:var(--sm-mono);font-size:12px"></textarea></div>' +
      '<div class="sm-row is-center" style="justify-content:space-between">' +
      '<span class="sm-t-3" style="font-size:12px">列名支持中英文：ip/IP地址、mac/MAC地址、hostname/主机名、os/操作系统、department/归属单位、owner/归属人、location/物理位置、description/备注</span>' +
      '<button class="sm-btn is-text is-sm" data-act="ledger-template" data-ico="download">下载模板</button></div>' +
      '<div id="lStatus" style="font-size:12px"></div>' +
      '</div>',
    okText: '开始导入',
    hideCancel: false,
    onOk: function (m) {
      var file = m.body.querySelector('#lFile').files[0];
      var text = m.body.querySelector('#lText').value.trim();
      var host = m.body.querySelector('#lStatus');
      var p;
      if (file) {
        p = API.ledgerImport(file);
      } else if (text) {
        p = API.ledgerImportText(text, '手动粘贴');
      } else {
        UI.toast('请选择文件或粘贴台账内容', 'err');
        return false;
      }
      host.innerHTML = UI.loadingHTML('正在导入并对照…');
      return p.then(function (r) {
        UI.toast('已导入 ' + r.imported + ' 条' + (r.skipped ? '（跳过 ' + r.skipped + ' 行）' : ''), 'ok');
        ledgerKind = 'unmanaged'; // 导入后直接看"账外设备"，这是最关心的结果
        loadLedger();
        return true;
      }).catch(function (e) {
        host.innerHTML = UI.errorHTML(e);
        return false;
      });
    },
    onOpen: function (api, bd) {
      var drop = bd.querySelector('#lDrop');
      var input = bd.querySelector('#lFile');
      var tip = bd.querySelector('#lDrop div[style*="font-weight"]');
      drop.addEventListener('click', function () { input.click(); });
      drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('is-over'); });
      drop.addEventListener('dragleave', function () { drop.classList.remove('is-over'); });
      drop.addEventListener('drop', function (e) {
        e.preventDefault(); drop.classList.remove('is-over');
        if (e.dataTransfer.files.length) {
          input.files = e.dataTransfer.files;
          tip.textContent = '已选择：' + e.dataTransfer.files[0].name;
        }
      });
      input.addEventListener('change', function () {
        if (input.files.length) tip.textContent = '已选择：' + input.files[0].name;
      });
    }
  });
}

function ledgerClear() {
  UI.confirm({ title: '清空台账', content: '确定清空当前台账吗？清空后所有主机都将显示为“台账外设备”，需重新导入才能对照。', okText: '清空' })
    .then(function (ok) {
      if (!ok) return;
      API.ledgerClear().then(function (r) {
        UI.toast('已清空 ' + (r.deleted || 0) + ' 条台账', 'ok');
        loadLedger();
      });
    });
}

/* ---------- 加载 ---------- */
function loadAssets() {
  return API.assets().then(function (d) { assets = d || []; renderAssets(); }).catch(function (e) { UI.toast(e.message, 'err'); });
}
function loadPorts() {
  return API.ports().then(function (d) { ports = d || []; renderPorts(); }).catch(function (e) { UI.toast(e.message, 'err'); });
}
function loadAll() {
  renderStats();
  loadAssets();
  loadPorts();
}

/* ---------- 事件绑定 ---------- */
UI.on('refresh', loadAll);

document.getElementById('fKw').addEventListener('input', renderAssets);
document.getElementById('fStatus').addEventListener('change', renderAssets);
document.getElementById('pIp').addEventListener('input', renderPorts);
document.getElementById('lKw').addEventListener('input', renderLedger);
document.querySelectorAll('.sm-tab[data-tab]').forEach(function (b) {

});

document.addEventListener('DOMContentLoaded', loadAll);
