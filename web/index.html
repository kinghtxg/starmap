<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拓扑总览 · StarMap 星图</title>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<div class="sm-app">
  <aside class="sm-sider" id="smSider"></aside>

  <main class="sm-main">
    <header class="sm-topbar">
      <div class="sm-topbar-l">
        <h1 class="sm-h1">拓扑总览</h1>
        <p class="sm-sub">自生长拓扑 · 异常锚点不聚合（红虚环）· 双击网段下钻 · 右键快捷操作</p>
      </div>
      <div class="sm-toolbar">
        <button class="sm-btn is-warn sm-hide" id="btnBack" data-act="back">返回上级</button>
        <select class="sm-select is-sm sm-w-auto" id="fRisk" aria-label="风险筛选">
          <option value="">全部风险</option>
          <option value="high">仅高风险</option>
          <option value="mid">仅中风险</option>
          <option value="low">仅低风险</option>
          <option value="none">仅正常</option>
        </select>
        <span class="sm-toolbar-sep"></span>
        <button class="sm-btn" id="btnRelayout" data-act="relayout" data-ico="layout">重新布局</button>
        <button class="sm-btn" id="btnRefresh" data-act="refresh" data-ico="refresh">刷新数据</button>
        <button class="sm-btn" id="btnSubnets" data-ico="grid">网段清单</button>
        <button class="sm-btn" data-act="png" data-ico="download">导出 PNG</button>
        <button class="sm-btn" data-act="svg" data-ico="download">导出 SVG</button>
      </div>
    </header>

    <div class="sm-content">
      <div class="sm-grid sm-grid-4 sm-anim" id="statsBar"></div>

      <div class="sm-row sm-anim" style="flex:1;min-height:420px;margin-top:12px" >
        <div id="topo" class="sm-card sm-topo-wrap" style="flex:1;min-width:0"></div>
        <div id="subnetPanel" class="sm-card sm-hide" style="flex:1;min-width:0;overflow:auto;padding:0"></div>

        <aside class="sm-card sm-hide" id="detailPanel" style="width:clamp(280px, 24vw, 360px);flex:0 0 clamp(280px, 24vw, 360px);display:flex;flex-direction:column;overflow:hidden">
          <div class="sm-card-hd">
            <div>
              <h2 style="font-size:14px">节点详情</h2>
              <div class="sm-t-3" id="detailKind">—</div>
            </div>
            <button class="sm-btn is-text is-icon is-sm" data-act="close-detail" title="关闭" data-ico="close"></button>
          </div>
          <div class="sm-card-bd" id="detailBody" style="overflow:auto;flex:1"></div>
        </aside>
      </div>
    </div>
  </main>
</div>

<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script src="assets/topo.js"></script>
<script>
'use strict';

var topo = null;
var snapshot = null;      // 当前拓扑快照
var parentSnapshot = null;// 上级快照（返回上级用）
var nodeCache = {};       // id -> node
var breadcrumb = ['全网拓扑'];

/* ---------- 节点判定（与后端契约保持一致） ---------- */
function isAggNode(n) {
  if (n.Aggregated) return true;
  var id = String(n.ID || '');
  return id.indexOf('subnet:') === 0;
}
function nodeCIDR(n) {
  var id = String(n.ID || '');
  if (id.indexOf('subnet:') === 0) return id.slice(7);
  if (id.indexOf('ext:') === 0) return null;
  if (n.IPs && n.IPs.length && n.IPs[0].indexOf('/') > 0) return n.IPs[0];
  if (id.indexOf('/') > 0) return id;
  return null;
}
function nodeLabel(n) {
  if (n.IPs && n.IPs.length) return String(n.IPs[0]);
  if (n.MAC) return String(n.MAC);
  return String(n.ID);
}

/* ---------- 统计卡片 ---------- */
function renderStats() {
  var st = (snapshot && snapshot.Stats) || {};
  var nodes = (snapshot && snapshot.Nodes) || [];
  var edges = (snapshot && snapshot.Edges) || [];
  var active = nodes.filter(function (n) { return n.Active !== false; }).length;
  var risky = nodes.filter(function (n) { return n.RiskLevel === 'high' || n.RiskLevel === 'mid'; }).length;
  var items = [
    { k: '发现节点', v: st.NodeCount != null ? st.NodeCount : nodes.length, i: 'node', cls: '', ex: '活跃 ' + active + ' / 离线 ' + (nodes.length - active) },
    { k: '链路边数', v: st.EdgeCount != null ? st.EdgeCount : edges.length, i: 'link', cls: '', ex: '活跃链路 ' + (st.ActiveEdges != null ? st.ActiveEdges : edges.filter(function (e) { return e.Active !== false; }).length) },
    { k: '风险节点', v: risky, i: 'warn', cls: risky ? 'is-high' : 'is-ok', ex: '高/中风险设备合计' },
    { k: '累计流量', v: st.TotalBytes || 0, i: 'ingest', cls: '', ex: '', fmt: 'bytes' }
  ];
  var host = document.getElementById('statsBar');
  host.innerHTML = items.map(function (it) {
    return '<div class="sm-stat ' + it.cls + '">' +
      '<div class="sm-stat-ico">' + UI.ico(it.i) + '</div>' +
      '<div style="min-width:0">' +
      '<div class="sm-stat-val" data-v="' + it.v + '" data-fmt="' + (it.fmt || 'num') + '">0</div>' +
      '<div class="sm-stat-key">' + it.k + '</div>' +
      (it.ex ? '<div class="sm-stat-extra">' + UI.esc(it.ex) + '</div>' : '') +
      '</div></div>';
  }).join('');
  Array.prototype.forEach.call(host.querySelectorAll('.sm-stat-val'), function (el) {
    var v = Number(el.getAttribute('data-v')) || 0;
    if (el.getAttribute('data-fmt') === 'bytes') el.textContent = UI.fmtBytes(v);
    else UI.countTo(el, v);
  });
}

/* ---------- 告警徽标：按节点聚合待处置事件 ---------- */
function loadAlerts() {
  return API.events({ status: 'pending' })
    .then(function (list) {
      var events = Array.isArray(list) ? list : (list && list.Events) || [];
      var map = {};
      events.forEach(function (ev) {
        var key = ev.NodeAPID || (ev.NodeID != null ? String(ev.NodeID) : '');
        if (!key) return;
        map[key] = (map[key] || 0) + 1;
      });
      if (topo) topo.setAlerts(map);
    })
    .catch(function () { /* 事件接口失败不影响拓扑 */ });
}

/* ---------- 拓扑构建 ---------- */
function buildGraph(data, keepView) {
  snapshot = data;
  nodeCache = {};
  (data.Nodes || []).forEach(function (n) { nodeCache[String(n.ID)] = n; });
  renderStats();
  if (!topo) {
    topo = SM.Topo.create(document.getElementById('topo'), {});
    bindTopo();
  }
  topo.setData(data);
  if (!keepView) topo.fit();
  loadAlerts();
}

function bindTopo() {
  topo.on('nodeClick', function (p) { showDetail(p.id); });

  topo.on('nodeDblClick', function (p) {
    var n = nodeCache[p.id];
    if (!n) return;
    var cidr = nodeCIDR(n);
    if (isAggNode(n) && cidr) drilldown(cidr);
    else showDetail(p.id);
  });

  topo.on('nodeHover', function (p) {
    if (!p || !p.node) { UI.tip.hide(); return; }
    var n = p.node;
    var lv = n.RiskLevel || 'none';
    UI.tip.show(
      '<b>' + UI.esc(nodeLabel(n)) + '</b>' +
      '<div class="sm-tip-row"><span>类型</span><span>' + UI.esc(SM.Topo.typeLabel(nodeType(n))) + '</span></div>' +
      '<div class="sm-tip-row"><span>风险</span><span>' + UI.esc(UI.riskLabel(lv)) + '</span></div>' +
      '<div class="sm-tip-row"><span>网络域</span><span>' + UI.esc(n.Domain || '-') + '</span></div>' +
      '<div class="sm-tip-row"><span>最后活跃</span><span>' + UI.esc(UI.fmtAgo(n.LastSeen)) + '</span></div>' +
      (isAggNode(n) ? '<div class="sm-tip-row"><span>网段主机</span><span>' + (n.Members || '—') + ' 台</span></div>' : '') +
      (isAggNode(n) ? '<div style="margin-top:4px;opacity:.7">双击下钻子网</div>' : '') +
      (n.Anchor ? '<div style="margin-top:4px;color:#e34d59">异常锚点 · 未参与网段聚合</div>' : ''),
      p.x, p.y);
  });

  topo.on('edgeHover', function (p) {
    if (!p || !p.edge) { UI.tip.hide(); return; }
    var e = p.edge;
    if (e.Kind === 'owner') {
      UI.tip.show(
        '<b>' + UI.esc(nodeLabel(nodeCache[p.a] || { ID: p.a })) + ' &rarr; ' + UI.esc(nodeLabel(nodeCache[p.b] || { ID: p.b })) + '</b>' +
        '<div class="sm-tip-row"><span>类型</span><span>网段归属</span></div>' +
        '<div style="margin-top:4px;opacity:.7">由该设备 IP 的 /24 归属推导，链路本身无流量</div>',
        p.x, p.y);
      return;
    }
    UI.tip.show(
      '<b>' + UI.esc(nodeLabel(nodeCache[p.a] || { ID: p.a })) + ' &harr; ' + UI.esc(nodeLabel(nodeCache[p.b] || { ID: p.b })) + '</b>' +
      '<div class="sm-tip-row"><span>协议</span><span>' + UI.esc(e.Protocol || '-') + '</span></div>' +
      '<div class="sm-tip-row"><span>流量</span><span>' + UI.esc(UI.fmtBytes(e.Bytes)) + '</span></div>' +
      '<div class="sm-tip-row"><span>报文</span><span>' + UI.esc(UI.fmtNum(e.Packets)) + '</span></div>' +
      '<div class="sm-tip-row"><span>状态</span><span>' + (e.Active === false ? '已老化' : '活跃') + '</span></div>',
      p.x, p.y);
  });

  topo.on('contextMenu', function (p) {
    if (!p.id) return;
    var n = p.node || {};
    var cidr = nodeCIDR(n);
    UI.menu(p.x, p.y, [
      { label: '查看详情', icon: 'info', act: 'ctx-detail' },
      { label: '居中定位', icon: 'target', act: 'ctx-locate' },
      { sep: true },
      { label: '下钻子网', icon: 'drill', act: 'ctx-drill', disabled: !(isAggNode(n) && cidr) },
      { label: '加入白名单', icon: 'shield', act: 'ctx-whitelist' }
    ], { id: p.id, node: n, cidr: cidr });
  });
}

function nodeType(n) {
  if (!topo) return 'unknown';
  if (String(n.ID).indexOf('ext:') === 0) return 'cloud';
  if (isAggNode(n)) return 'subnet';
  return 'unknown';
}

/* ---------- 节点详情 ---------- */
function showDetail(id) {
  var panel = document.getElementById('detailPanel');
  var body = document.getElementById('detailBody');
  panel.classList.remove('sm-hide');
  body.innerHTML = UI.loadingHTML('加载节点详情…');
  API.node(id).then(function (resp) {
    var n = resp.Node || resp;
    var peers = (snapshot.Edges || []).filter(function (e) { return e.SrcID === id || e.DstID === id; });
    var cidr = nodeCIDR(n);
    document.getElementById('detailKind').textContent = isAggNode(n) ? '网段聚合节点' : SM.Topo.typeLabel(nodeType(n));
    var h = '<div class="sm-stack-sm">' +
      kv('节点 ID', '<span class="sm-mono">' + UI.esc(n.ID) + '</span>') +
      kv('IP 地址', (n.IPs || []).length ? (n.IPs || []).map(function (i) { return '<div class="sm-mono">' + UI.esc(i) + '</div>'; }).join('') : '-') +
      kv('MAC 地址', n.MAC ? '<span class="sm-mono">' + UI.esc(n.MAC) + '</span>' : '-') +
      kv('归属网络域', n.Domain ? '<span class="sm-badge is-brand">' + UI.esc(n.Domain) + '</span>' : '-') +
      kv('风险等级', UI.riskTag(n.RiskLevel)) +
      kv('在线状态', n.Active === false
        ? '<span class="sm-dot is-off"></span> 已老化'
        : '<span class="sm-dot is-on"></span> 在线') +
      kv('标签', (n.Labels || []).length
        ? '<div class="sm-chips">' + n.Labels.map(function (l) { return '<span class="sm-chip">' + UI.esc(l) + '</span>'; }).join('') + '</div>'
        : '-') +
      kv('首次发现', UI.fmtTime(n.FirstSeen)) +
      kv('最后活跃', UI.fmtTime(n.LastSeen)) +
      '</div>';

    if (resp.Members && resp.Members.length) {
      h += '<div class="sm-divider"></div><div class="sm-label" style="margin-bottom:8px">聚合成员（' + resp.Members.length + '）</div>' +
        '<div class="sm-stack-sm" style="max-height:200px;overflow:auto">' + resp.Members.map(function (m) {
          return '<div class="sm-row is-center" style="justify-content:space-between;padding:5px 8px;background:var(--sm-bg-alt);border-radius:3px">' +
            '<span class="sm-mono" style="font-size:12px">' + UI.esc(nodeLabel(m)) + '</span>' +
            UI.riskTag(m.RiskLevel) + '</div>';
        }).join('') + '</div>';
    }

    h += '<div class="sm-divider"></div><div class="sm-label" style="margin-bottom:8px">通信对端（' + peers.length + '）</div>';
    h += peers.length
      ? '<div class="sm-stack-sm" style="max-height:240px;overflow:auto">' + peers.map(function (e) {
        var other = e.SrcID === id ? e.DstID : e.SrcID;
        var on = nodeCache[other];
        return '<div class="sm-row is-center" style="justify-content:space-between;padding:6px 8px;background:var(--sm-bg-alt);border-radius:3px">' +
          '<span class="sm-mono" style="font-size:12px;color:var(--sm-brand-2);cursor:pointer" data-act="peer" data-id="' + UI.escAttr(other) + '">' +
          UI.esc(on ? nodeLabel(on) : other) + '</span>' +
          '<span class="sm-t-3" style="font-size:11px">' + UI.esc(e.Protocol || '-') + ' · ' + UI.esc(UI.fmtBytes(e.Bytes)) + '</span></div>';
      }).join('') + '</div>'
      : '<div class="sm-t-3" style="font-size:12px">暂无对端</div>';

    body.innerHTML = h;
  }).catch(function (e) {
    body.innerHTML = UI.errorHTML(e);
  });
}
function kv(k, v) {
  return '<div class="sm-kv"><div class="sm-kv-k">' + k + '</div><div class="sm-kv-v">' + v + '</div></div>';
}

/* ---------- 下钻 / 返回 ---------- */
function drilldown(cidr) {
  UI.toast('正在下钻子网 ' + cidr + ' …', 'info');
  topo.showOverlay('<div style="text-align:center">' + UI.loadingHTML('加载子网拓扑 ' + cidr + ' …') + '</div>');
  API.subnetTopology(cidr).then(function (data) {
    if (!data.Nodes || !data.Nodes.length) {
      topo.showOverlay(UI.emptyHTML('子网 ' + cidr + ' 内暂无节点', '该网段可能尚未聚合或已被老化清理'));
      return;
    }
    parentSnapshot = snapshot;
    breadcrumb.push(cidr);
    buildGraph(data);
    document.getElementById('btnBack').classList.remove('sm-hide');
    document.getElementById('btnBack').textContent = '← 返回' + (breadcrumb.length > 1 ? '上级' : '全网');
    UI.toast('已进入子网 ' + cidr, 'ok');
  }).catch(function (e) {
    topo.showOverlay(UI.errorHTML(e));
    UI.toast('下钻失败：' + e.message, 'err');
  });
}
function backToTop() {
  if (!parentSnapshot) return;
  breadcrumb.pop();
  buildGraph(parentSnapshot);
  parentSnapshot = null;
  document.getElementById('btnBack').classList.add('sm-hide');
  UI.toast('已返回上级拓扑', 'ok');
}

/* ---------- 加入白名单 ---------- */
function addWhitelist(prefill) {
  UI.modal({
    title: '加入白名单',
    body:
      '<div class="sm-stack">' +
      '<div class="sm-field"><label>类型</label><select class="sm-select" id="wlKind">' +
      '<option value="cidr">CIDR 网段</option><option value="ip">IP 地址</option>' +
      '<option value="host">主机/域名</option><option value="node">拓扑节点</option></select></div>' +
      '<div class="sm-field"><label>值</label><input class="sm-input" id="wlValue" placeholder="如 10.0.0.0/8 / 192.168.1.1" value="' + UI.escAttr(prefill || '') + '"></div>' +
      '<div class="sm-field"><label>备注</label><input class="sm-input" id="wlNote" placeholder="可选，如：办公网段放行"></div>' +
      '<div class="sm-alert is-info"><span class="sm-alert-ico">' + UI.ico('info') + '</span>' +
      '<div class="sm-alert-body">保存后将自动抑制该维度下已有的待处置事件。</div></div>' +
      '</div>',
    okText: '保存',
    onOk: function (m) {
      var v = m.body.querySelector('#wlValue').value.trim();
      if (!v) { UI.toast('请填写值', 'err'); return false; }
      return API.createWhitelist({
        Kind: m.body.querySelector('#wlKind').value,
        Value: v,
        Note: m.body.querySelector('#wlNote').value.trim()
      }).then(function () {
        UI.toast('已加入白名单', 'ok');
        loadAlerts();
      });
    }
  });
}

/* ---------- 事件绑定（事件委托，无内联 onclick） ---------- */
UI.on('refresh', load);
UI.on('relayout', function () { if (topo) { topo.relayout(); UI.toast('已重新布局', 'ok'); } });
UI.on('back', backToTop);
UI.on('png', function () { if (topo) { topo.exportPNG(); UI.toast('PNG 已导出', 'ok'); } });
UI.on('svg', function () { if (topo) { topo.exportSVG(); UI.toast('SVG 已导出', 'ok'); } });
UI.on('close-detail', function () { document.getElementById('detailPanel').classList.add('sm-hide'); });
UI.on('peer', function (el) { showDetail(el.getAttribute('data-id')); });
UI.on('topo-reload', load);
UI.on('ctx-detail', function (el, ctx) { showDetail(ctx.id); });
UI.on('ctx-locate', function (el, ctx) { if (topo) topo.centerOn(ctx.id); });
UI.on('ctx-drill', function (el, ctx) { if (ctx.cidr) drilldown(ctx.cidr); });
UI.on('ctx-whitelist', function (el, ctx) {
  var n = ctx.node || {};
  var ip = (n.IPs && n.IPs[0]) ? String(n.IPs[0]).replace(/\/.*$/, '') : '';
  addWhitelist(ip || ctx.id);
});

document.getElementById('fRisk').addEventListener('change', function () {
  if (topo) topo.setRiskFilter(this.value);
});

/* ---------- 网段清单视图（V1.4）：直接回答"网内结构" ---------- */
var subnetView = false;
// V1.7：台账对照结果按 /24 汇总，用于在网段清单里标出"哪个网段的账外机最集中"
var ledgerUnmanaged = {};   // "10.10.1.0/24" -> 台账外设备数
var ledgerImported = false; // 是否已导入台账（未导入时不显示"台账外"列，避免全部标红误导）

function cidr24Of(ip) {
  var p = String(ip || '').split('.');
  if (p.length !== 4) return '';
  return p[0] + '.' + p[1] + '.' + p[2] + '.0/24';
}

function loadLedgerMarks() {
  return API.ledgerDiff().then(function (d) {
    ledgerImported = !!(d && d.summary && d.summary.ledger_total > 0);
    var m = {};
    ((d && d.unmanaged) || []).forEach(function (x) {
      var c = cidr24Of(x.ip);
      if (c) m[c] = (m[c] || 0) + 1;
    });
    ledgerUnmanaged = m;
  }).catch(function () { /* 台账未导入或接口不可用时静默降级 */ });
}

document.getElementById('btnSubnets').addEventListener('click', function () {
  subnetView = !subnetView;
  document.getElementById('topo').classList.toggle('sm-hide', subnetView);
  document.getElementById('subnetPanel').classList.toggle('sm-hide', !subnetView);
  this.textContent = subnetView ? '拓扑视图' : '网段清单';
  if (subnetView) loadSubnets();
});

function riskBadge(lv) {
  if (lv === 'high') return '<span class="sm-badge is-danger">高</span>';
  if (lv === 'mid') return '<span class="sm-badge is-warn">中</span>';
  if (lv === 'low') return '<span class="sm-badge">低</span>';
  return '<span class="sm-badge is-ok">正常</span>';
}

function loadSubnets() {
  var host = document.getElementById('subnetPanel');
  host.innerHTML = '<div style="padding:16px" class="sm-t-3">正在加载网段清单…</div>';
  return Promise.all([API.subnets(), loadLedgerMarks()]).then(function (r) {
    var list = r[0] || [];
    if (!list.length) {
      host.innerHTML = '<div class="sm-empty" style="padding:48px 16px">尚未发现内网网段。导入流量或开启自动发现后，网段会自动出现。</div>';
      return;
    }
    var totalHost = list.reduce(function (s, x) { return s + (x.host_count || 0); }, 0);
    var rows = list.map(function (s) {
      var agg = s.aggregated
        ? '<span class="sm-badge is-brand">已聚合</span>'
        : '<span class="sm-badge">展开</span>';
      var un = ledgerUnmanaged[s.cidr] || 0;
      var unCell = ledgerImported
        ? (un ? '<span class="sm-badge is-danger">' + un + ' 台</span>' : '<span class="sm-t-3">—</span>')
        : '';
      return '<tr>' +
        '<td><span class="sm-mono">' + UI.esc(s.cidr) + '</span></td>' +
        '<td>' + (s.host_count || 0) + '</td>' +
        '<td>' + (s.online || 0) + '</td>' +
        (ledgerImported ? '<td>' + unCell + '</td>' : '') +
        '<td><span class="sm-mono sm-t-3">' + UI.esc(s.gateway_mac || '—') + '</span></td>' +
        '<td>' + UI.esc(s.location || '—') + '</td>' +
        '<td>' + riskBadge(s.risk_level) + (s.risk_count ? ' <span class="sm-t-3">×' + s.risk_count + '</span>' : '') + '</td>' +
        '<td>' + agg + '</td>' +
        '<td><button class="sm-btn is-text is-sm" data-cidr="' + UI.escAttr(s.cidr) + '">下钻</button></td>' +
        '</tr>';
    }).join('');
    host.innerHTML =
      '<div class="sm-card-hd" style="padding:14px 16px">' +
        '<div><h2 style="font-size:14px">网段清单</h2>' +
        '<div class="sm-t-3">共 ' + list.length + ' 个网段 · ' + totalHost + ' 台主机' +
        (ledgerImported ? ' · 台账外设备按网段汇总' : '') + '</div></div>' +
      '</div>' +
      '<div class="sm-card-bd" style="padding:0">' +
      '<table class="sm-table"><thead><tr>' +
      '<th>网段</th><th>主机数</th><th>在线</th>' + (ledgerImported ? '<th>台账外</th>' : '') +
      '<th>网关 MAC</th><th>探针位置</th><th>最高风险</th><th>状态</th><th></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    Array.prototype.forEach.call(host.querySelectorAll('button[data-cidr]'), function (btn) {
      btn.addEventListener('click', function () {
        var cidr = btn.getAttribute('data-cidr');
        // 切回拓扑视图并下钻该网段
        subnetView = false;
        document.getElementById('topo').classList.remove('sm-hide');
        document.getElementById('subnetPanel').classList.add('sm-hide');
        document.getElementById('btnSubnets').textContent = '网段清单';
        drilldown(cidr);
      });
    });
  }).catch(function () {
    host.innerHTML = '<div class="sm-empty" style="padding:48px 16px">加载网段清单失败。</div>';
  });
}

/* ---------- 加载 ---------- */
function load() {
  if (!topo) {
    topo = SM.Topo.create(document.getElementById('topo'), {});
    bindTopo();
  }
  topo.showOverlay(UI.loadingHTML('正在获取拓扑快照…'));
  return API.topology().then(function (data) {
    parentSnapshot = null;
    breadcrumb = ['全网拓扑'];
    document.getElementById('btnBack').classList.add('sm-hide');
    if (!data.Nodes || !data.Nodes.length) {
      snapshot = data;
      renderStats();
      topo.setData({ Nodes: [], Edges: [] });
      return;
    }
    buildGraph(data);
  }).catch(function (e) {
    if (topo) topo.showOverlay(UI.errorHTML(e));
    snapshot = null;
    renderStats();
  });
}

document.addEventListener('DOMContentLoaded', load);
window.addEventListener('resize', function () { if (topo) topo.resize(); });
</script>
