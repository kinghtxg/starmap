<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统配置 · StarMap 星图</title>
<link rel="stylesheet" href="assets/theme.css">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
<div class="sm-app">
  <header class="sm-topbar" id="smTopbar"></header>

  <div class="sm-body">
    <aside class="sm-sider" id="smSider"></aside>

    <main class="sm-main">
      <div class="sm-pagehd">
        <div class="sm-pagehd-main">
          <span class="sm-pill">运维</span>
          <h1 class="sm-h1">系统配置</h1>
          <p class="sm-sub">GET /api/config · PUT /api/config · 保存后立即联动拓扑引擎与检测引擎</p>
        </div>
          <div class="sm-toolbar">
          <button class="sm-btn" data-act="reload" data-ico="refresh">重新加载</button>
          <button class="sm-btn is-primary" data-role="admin" data-act="save" data-ico="check">保存配置</button>
        </div>
      </div>

    <div class="sm-content">
      <div class="sm-stack sm-anim" id="form"></div>
    </div>
  </main>
  </div>
</div>

<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script>
'use strict';

/* 已知字段元数据：key=规范键（PUT 生效），alias=GET 回显的兼容别名 */
var FIELDS = [
  { key: 'probe_enabled', alias: '', label: '主动探测开关', type: 'bool', desc: '开启后可执行 ARP / ICMP / Traceroute 主动探测（默认关闭，合规建议保持关闭）', group: '探测与采集' },
  { key: 'capture_enabled', alias: '', label: '实时抓包开关', type: 'bool', desc: '允许通过接口启动多网卡实时抓包', group: '探测与采集' },
  { key: 'capture_interfaces', alias: 'interfaces', label: '抓包网卡', type: 'list', desc: '每行一个网卡名，如 eth0；留空则无法启动抓包', group: '探测与采集' },
  { key: 'capture_bpf', alias: '', label: 'BPF 过滤表达式', type: 'text', desc: '如 tcp port 443，留空表示不过滤', group: '探测与采集' },
  { key: 'probe_token', alias: '', label: '探针上报令牌', type: 'secret', desc: '远端探针 /api/ingest/probe 的鉴权令牌，留空表示不校验（不会回显明文）', group: '探测与采集' },

  { key: 'aging_seconds', alias: '', label: '链路老化时长（秒）', type: 'number', desc: '链路超过该时长无流量则置灰，默认 86400', group: '拓扑引擎' },
  { key: 'aggregate_threshold', alias: '', label: '网段聚合阈值', type: 'number', desc: '同 /24 节点数超过该值则聚合为可下钻的网段节点，默认 20', group: '拓扑引擎' },
  { key: 'noise_bytes', alias: 'noise_min_bytes', label: '降噪字节阈值', type: 'number', desc: '会话字节数低于该值不建边，默认 400', group: '拓扑引擎' },
  { key: 'noise_packets', alias: 'noise_min_packets', label: '降噪包数阈值', type: 'number', desc: '短会话包数低于该值不建边，默认 4', group: '拓扑引擎' },
  { key: 'noise_duration_sec', alias: '', label: '降噪时长阈值（秒）', type: 'number', desc: '会话持续时长低于该值不建边，默认 2', group: '拓扑引擎' },

  { key: 'reverse_proxy_hosts', alias: 'reverse_proxy_host_threshold', label: '反代 Host 数阈值', type: 'number', desc: '单内网 IP 对外映射的 Host 数超过该值则标记反向代理，默认 10', group: '检测规则' },
  { key: 'long_conn_seconds', alias: '', label: '长连接判定时长（秒）', type: 'number', desc: '超过该时长视为长连接，用于隧道心跳检测，默认 3600', group: '检测规则' },
  { key: 'heartbeat_max_bytes', alias: '', label: '心跳包最大字节', type: 'number', desc: '低于该字节的长连接交互视为心跳，默认 64', group: '检测规则' },

  { key: 'scan_ports', alias: '', label: '端口扫描范围（nmap -p）', type: 'text', desc: '主动端口扫描的端口范围，默认 1-65535（全端口）', group: '资产与扫描' },
  { key: 'scan_rate', alias: '', label: '扫描速率模板（nmap -T）', type: 'text', desc: 'T0~T5，越大越快越激进，默认 T4', group: '资产与扫描' },
  { key: 'unarchived_offline_hours', alias: '', label: '账外资产离线清理阈值（小时）', type: 'number', desc: '未归档主机离线超过该时长自动从拓扑删除，默认 72，0 表示不清理', group: '资产与扫描' },
  { key: 'archive_offline_seconds', alias: '', label: '归档主机离线判定（秒）', type: 'number', desc: '归档主机最后发现超过该时长标记离线，默认 600', group: '资产与扫描' },

  { key: 'discover_enabled', alias: '', label: '主动发现开关', type: 'bool', desc: '开启后允许「深度发现」：内置 TCP 端口扫描 + 服务指纹（不依赖 nmap）。会在目标侧留下连接记录，请确认已获授权', group: '资产与扫描' },
  { key: 'discover_profile', alias: '', label: '默认端口档位', type: 'text', desc: 'quick=内网高价值端口（约 100 个，默认）· standard=1-1024+常见高位 · full=1-65535 全端口', group: '资产与扫描' },
  { key: 'discover_fingerprint', alias: '', label: '服务指纹识别', type: 'bool', desc: '对高价值端口识别产品 / 版本 / 页面标题 / TLS 证书 / favicon（建议开启）', group: '资产与扫描' },
  { key: 'discover_rate_pps', alias: '', label: '扫描速率上限（pps）', type: 'number', desc: '全局每秒连接数上限，默认 800。政务网老交换机建议不超过 800，调高可能打挂管理面', group: '资产与扫描' },
  { key: 'discover_concurrency', alias: '', label: '单主机并发连接', type: 'number', desc: '默认 256，上限 2048。与速率上限共同决定扫描节奏', group: '资产与扫描' },
  { key: 'discover_timeout_ms', alias: '', label: '单端口超时（毫秒）', type: 'number', desc: '默认 800。跨网段丢包多时可适当加大，但会整体变慢', group: '资产与扫描' },
  { key: 'discover_max_fingerprints', alias: '', label: '单主机指纹端口上限', type: 'number', desc: '默认 32。只对最有价值的端口（TLS / Web / 已知服务）做指纹，避免变成小型 DoS', group: '资产与扫描' },
  { key: 'discover_window', alias: '', label: '扫描时间窗口', type: 'text', desc: '如 22:00-06:00（支持跨夜），留空=全天。窗口外周期扫描直接跳过', group: '资产与扫描' },
  { key: 'discover_sec', alias: '', label: '周期扫描间隔（秒）', type: 'number', desc: '0=仅手动触发；如 21600 表示每 6 小时自动扫一轮', group: '资产与扫描' },
  { key: 'discover_cidrs', alias: '', label: '周期扫描网段', type: 'list', desc: '每行一个网段，如 10.10.1.0/24；仅当间隔 > 0 时生效', group: '资产与扫描' },

  { key: 'listen_addr', alias: 'http_listen', label: 'HTTP 监听地址', type: 'text', desc: '如 127.0.0.1:18080；修改后需重启服务生效', group: '服务与安全' },
  { key: 'audit_retention_days', alias: '', label: '审计日志保留天数', type: 'number', desc: '默认 90 天', group: '服务与安全' }
];

var READONLY = { db_path: '数据库路径', probe_token_set: '探针令牌已设置' };
var config = null;

function valueOf(f) {
  if (Object.prototype.hasOwnProperty.call(config, f.key)) return config[f.key];
  if (f.alias && Object.prototype.hasOwnProperty.call(config, f.alias)) return config[f.alias];
  return undefined;
}

function load() {
  var el = document.getElementById('form');
  el.innerHTML = '<div class="sm-card"><div class="sm-card-bd">' + UI.loadingHTML('正在加载配置…') + '</div></div>';
  return API.getConfig().then(function (cfg) {
    config = cfg || {};
    render();
  }).catch(function (e) {
    config = null;
    el.innerHTML = '<div class="sm-card"><div class="sm-card-bd">' + UI.errorHTML(e) + '</div></div>';
  });
}

function render() {
  var el = document.getElementById('form');
  if (!config) return;
  var groups = [];
  var map = {};
  FIELDS.forEach(function (f) {
    if (!map[f.group]) { map[f.group] = []; groups.push(f.group); }
    map[f.group].push(f);
  });

  var html = groups.map(function (g, gi) {
    return '<section class="sm-card" style="animation:sm-fade-up 240ms var(--sm-ease) both;animation-delay:' + (gi * 60) + 'ms">' +
      '<div class="sm-card-hd"><h2>' + UI.esc(g) + '</h2>' +
      '<span class="sm-badge">' + map[g].length + ' 项</span></div>' +
      '<div class="sm-card-bd"><div class="sm-stack">' +
      map[g].map(function (f) { return fieldHTML(f); }).join('<div class="sm-divider" style="margin:4px 0"></div>') +
      '</div></div></section>';
  }).join('');

  var used = {};
  FIELDS.forEach(function (f) { used[f.key] = true; if (f.alias) used[f.alias] = true; });
  Object.keys(READONLY).forEach(function (k) { used[k] = true; });
  var rest = {};
  Object.keys(config).forEach(function (k) { if (!used[k]) rest[k] = config[k]; });
  if (Object.keys(rest).length || Object.keys(READONLY).length) {
    var ro = {};
    Object.keys(READONLY).forEach(function (k) { if (k in config) ro[READONLY[k]] = config[k]; });
    Object.keys(rest).forEach(function (k) { ro[k] = rest[k]; });
    html += '<section class="sm-card" style="animation:sm-fade-up 240ms var(--sm-ease) both;animation-delay:' + (groups.length * 60) + 'ms">' +
      '<div class="sm-card-hd"><h2>只读信息</h2><span class="sm-t-3" style="font-size:12px">由服务内部维护 / PUT 不消费</span></div>' +
      '<div class="sm-card-bd"><pre class="sm-code" style="max-height:220px">' +
      UI.esc(JSON.stringify(ro, null, 2)) + '</pre></div></section>';
  }
  el.innerHTML = html;
}

function fieldHTML(f) {
  var raw = valueOf(f);
  var id = 'cfg_' + f.key;
  var head = '<label style="font-size:13px;font-weight:500;display:block;margin-bottom:6px">' + UI.esc(f.label) + '</label>';
  var desc = '<div class="sm-hint" style="font-size:11px;color:var(--sm-text-3);margin-top:6px">' + UI.esc(f.desc) + '</div>';
  if (f.type === 'bool') {
    var on = raw === true;
    return '<div>' + head +
      '<label class="sm-switch"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '>' +
      '<span class="sm-switch-track"></span><span class="sm-switch-txt">' + (on ? '已开启' : '已关闭') + '</span></label>' +
      desc + '</div>';
  }
  if (f.type === 'number') {
    return '<div>' + head +
      '<input type="number" class="sm-input sm-w-auto" id="' + id + '" value="' + UI.escAttr(raw != null ? raw : '') + '">' +
      desc + '</div>';
  }
  if (f.type === 'list') {
    var v = Array.isArray(raw) ? raw.join('\n') : (raw || '');
    return '<div>' + head +
      '<textarea class="sm-textarea sm-mono" id="' + id + '" rows="3">' + UI.esc(v) + '</textarea>' +
      desc + '</div>';
  }
  if (f.type === 'secret') {
    var set = config.probe_token_set === true;
    return '<div>' + head +
      '<input type="password" class="sm-input sm-w-auto" id="' + id + '" autocomplete="new-password" ' +
      'placeholder="' + (set ? '已设置，留空表示不修改' : '留空表示不校验') + '">' +
      desc + '</div>';
  }
  return '<div>' + head +
    '<input class="sm-input" id="' + id + '" value="' + UI.escAttr(raw != null ? raw : '') + '">' +
    desc + '</div>';
}

function save() {
  if (!config) { UI.toast('配置尚未加载', 'err'); return; }
  var out = {};
  FIELDS.forEach(function (f) {
    var el = document.getElementById('cfg_' + f.key);
    if (!el) return;
    var v;
    if (f.type === 'bool') v = el.checked;
    else if (f.type === 'number') v = el.value === '' ? null : Number(el.value);
    else if (f.type === 'list') v = el.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    else v = el.value;
    if (f.type === 'secret' && v === '') return; // 留空不修改
    if (v === null || v === '') return;          // 空值不下发，避免把阈值置 0
    out[f.key] = v;
    if (f.alias) out[f.alias] = v;
  });
  if (!Object.keys(out).length) { UI.toast('没有需要保存的变更', 'info'); return; }
  API.putConfig(out)
    .then(function () { UI.toast('配置已保存并生效', 'ok'); load(); })
    .catch(function (e) { UI.toast('保存失败：' + e.message, 'err'); });
}

UI.on('reload', load);
UI.on('save', save);

/* 开关文案联动 */
document.addEventListener('change', function (e) {
  var t = e.target;
  if (!t || t.type !== 'checkbox' || !t.id || t.id.indexOf('cfg_') !== 0) return;
  var txt = t.parentNode.querySelector('.sm-switch-txt');
  if (txt) txt.textContent = t.checked ? '已开启' : '已关闭';
});

document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
